# Valkey do BadBlock: cache puro das APIs (api-cgibr e as próximas).
#
# Nada é persistido. Se o container reiniciar, o cache recomeça vazio e cada
# API volta a buscar no Postgres. A senha e o teto de memória chegam pela linha
# de comando (docker-compose.yml), a partir do .env.

bind 0.0.0.0 -::*
port 6379

save ""
appendonly no

maxmemory-policy allkeys-lru
lazyfree-lazy-eviction yes
