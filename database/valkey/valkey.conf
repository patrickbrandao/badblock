# Valkey do BadBlock: cache das APIs e fila de tempo real do rdns
# (api-rdns → collector-rdns).
#
# Nada é persistido. Se o container reiniciar, o cache recomeça vazio, cada
# API volta a buscar no Postgres e os pedidos de tempo real na fila se perdem.
# A senha e o teto de memória chegam pela linha de comando
# (docker-compose.yml), a partir do .env.
#
# volatile-lru: com a memória cheia, saem só as chaves com TTL (todo o cache
# e as listas de retorno do rdns); a fila do rdns, sem TTL, nunca é despejada.

bind 0.0.0.0 -::*
port 6379

save ""
appendonly no

maxmemory-policy volatile-lru
lazyfree-lazy-eviction yes
