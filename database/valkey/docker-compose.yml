# Valkey do BadBlock: cache cache-aside das APIs e fila de tempo real do rdns.
#
# Sobe junto com o resto pelo compose da raiz (include) ou sozinho, a partir
# desta pasta, com um .env próprio (copie o .env.example). Não publica porta no
# host: só os containers da rede badblock o alcançam.

name: badblock-valkey

services:
  valkey:
    image: valkey/valkey:9-alpine
    container_name: badblock-valkey
    restart: unless-stopped
    # Toda a configuração vai na linha de comando, sem arquivo montado.
    # Nada é persistido (save "", appendonly no): se o container reiniciar, o
    # cache recomeça vazio e os pedidos de tempo real na fila se perdem.
    # volatile-lru: com a memória cheia, saem só as chaves com TTL (todo o
    # cache e as listas de retorno do rdns); a fila do rdns, sem TTL, nunca é
    # despejada. Com VALKEY_PASSWORD vazio o Valkey sobe sem senha (só a rede
    # badblock o alcança); com valor, exige autenticação.
    command:
      - sh
      - -c
      - >-
        exec valkey-server
        --bind 0.0.0.0 '-::*'
        --port 6379
        --save ''
        --appendonly no
        --maxmemory-policy volatile-lru
        --lazyfree-lazy-eviction yes
        --maxmemory "$$VALKEY_MAXMEMORY"
        $${VALKEY_PASSWORD:+--requirepass "$$VALKEY_PASSWORD"}
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      VALKEY_MAXMEMORY: ${VALKEY_MAXMEMORY:-256mb}
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD:-}
    networks:
      badblock:
        aliases: [badblock-valkey]
    labels:
      # O Traefik do servidor publica todo container por padrão.
      traefik.enable: "false"
    healthcheck:
      # VALKEYCLI_AUTH vazio faria o valkey-cli tentar um AUTH sem senha.
      test: ["CMD-SHELL", "[ -n \"$$VALKEYCLI_AUTH\" ] || unset VALKEYCLI_AUTH; valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  badblock:
    name: badblock
    external: true
