# Valkey do BadBlock: cache cache-aside das APIs.
#
# Sobe junto com o resto pelo compose da raiz (include) ou sozinho, a partir
# desta pasta, com um .env próprio (copie o .env.example). Não publica porta no
# host: só os containers da rede badblock o alcançam.

name: badblock-valkey

services:
  valkey:
    image: valkey/valkey:9-alpine
    container_name: badblock-valkey
    restart: unless-stopped
    # Com VALKEY_PASSWORD vazio o Valkey sobe sem senha (só a rede badblock o
    # alcança); com valor, exige autenticação.
    command:
      - sh
      - -c
      - exec valkey-server /usr/local/etc/valkey/valkey.conf --maxmemory "$$VALKEY_MAXMEMORY" $${VALKEY_PASSWORD:+--requirepass "$$VALKEY_PASSWORD"}
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      VALKEY_MAXMEMORY: ${VALKEY_MAXMEMORY:-256mb}
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD:-}
    volumes:
      - ./valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
    networks:
      badblock:
        aliases: [badblock-valkey]
    labels:
      # O Traefik do servidor publica todo container por padrão.
      traefik.enable: "false"
    healthcheck:
      # VALKEYCLI_AUTH vazio faria o valkey-cli tentar um AUTH sem senha.
      test: ["CMD-SHELL", "[ -n \"$$VALKEYCLI_AUTH\" ] || unset VALKEYCLI_AUTH; valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  badblock:
    name: badblock
    external: true
