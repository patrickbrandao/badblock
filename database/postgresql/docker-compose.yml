# PostgreSQL 18 do BadBlock: servidor, migrations (dbmate) e backup diário.
#
# Sobe junto com o resto pelo compose da raiz (include) ou sozinho, a partir
# desta pasta, com um .env próprio (copie o .env.example):
#
#   docker network create badblock    # uma vez; na raiz: make network
#   docker compose up -d
#
# O serviço migrate roda a cada `up`: aplica as migrations pendentes e sai.
# O bootstrap (roles, banco, extensões) roda sozinho na primeira subida do
# volume; para reaplicar (ex.: trocar senhas), use `make bootstrap`.

name: badblock-postgresql

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18-trixie
    container_name: badblock-postgres
    restart: unless-stopped
    shm_size: 256mb
    stop_grace_period: 60s
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: postgres
      BADBLOCK_DB: badblock
      BADBLOCK_OWNER_PASSWORD: ${BADBLOCK_OWNER_PASSWORD:?defina BADBLOCK_OWNER_PASSWORD no .env}
      BADBLOCK_SYNC_PASSWORD: ${BADBLOCK_SYNC_PASSWORD:?defina BADBLOCK_SYNC_PASSWORD no .env}
      BADBLOCK_API_PASSWORD: ${BADBLOCK_API_PASSWORD:?defina BADBLOCK_API_PASSWORD no .env}
    # Só no loopback: acesso administrativo local ou por túnel SSH. A 5432 do
    # Mac de desenvolvimento já é de outro projeto, daí a 5433.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # No PG 18+ o volume vai em /var/lib/postgresql (o PGDATA virou
      # /var/lib/postgresql/18/docker).
      - pgdata:/var/lib/postgresql
      - ./bootstrap:/docker-entrypoint-initdb.d:ro
    networks:
      badblock:
        aliases: [badblock-postgres]
    healthcheck:
      # Via TCP: durante o initdb o servidor temporário só escuta no socket,
      # então o container só fica saudável depois do bootstrap.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d badblock"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: *logging

  migrate:
    image: ghcr.io/amacneil/dbmate:2.36
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://badblock_owner:${BADBLOCK_OWNER_PASSWORD:?defina BADBLOCK_OWNER_PASSWORD no .env}@badblock-postgres:5432/badblock?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_WAIT: "true"
      DBMATE_WAIT_TIMEOUT: 120s
    command: ["up"]
    volumes:
      - ./migrations:/db/migrations:ro
    networks: [badblock]
    logging: *logging

  backup:
    image: postgres:18-trixie
    container_name: badblock-backup
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    command: ["daemon"]
    environment:
      PGHOST: badblock-postgres
      PGUSER: badblock_owner
      PGPASSWORD: ${BADBLOCK_OWNER_PASSWORD:?defina BADBLOCK_OWNER_PASSWORD no .env}
      PGDATABASE: badblock
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
    volumes:
      - backups:/backups
      - ./backup:/backup:ro
    networks: [badblock]
    logging: *logging

volumes:
  pgdata:
    name: badblock-pgdata
  backups:
    name: badblock-backups

networks:
  badblock:
    name: badblock
    external: true
