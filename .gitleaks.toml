# gitleaks — o repositório é público: nenhum segredo real pode entrar nele.
# Estende as regras padrão e libera só o que é dado público ou falso de teste.

title = "BadBlock"

[extend]
useDefault = true

[allowlist]
description = "Dados públicos das fontes e senhas falsas dos testes"
paths = [
  # Recortes dos arquivos públicos das fontes.
  '''apps/[^/]+/[^/]+/testdata/''',
  # Dependências Go vendorizadas: código de terceiros.
  '''apps/[^/]+/[^/]+/vendor/''',
  # Material local, fora do git (o scan `dir` do make gitleaks também os vê).
  '''(^|/)(old|tmp)/''',
  # Dependências e build dos sites, fora do git.
  '''websites/[^/]+/(node_modules|dist)/''',
  '''\.mcp\.json$''',
  '''(^|/)\.env$''',
]
regexes = [
  # Senhas fixas e óbvias dos containers descartáveis dos testes.
  '''(collector|api|owner|test)pw''',
  '''POSTGRES_PASSWORD=pg\b''',
]
