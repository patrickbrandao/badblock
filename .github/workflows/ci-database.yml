name: database

on:
  push:
    branches: [main]
    paths:
      - database/**
      - .github/workflows/ci-database.yml
  pull_request:
    paths:
      - database/**
      - .github/workflows/ci-database.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Bootstrap do zero, todas as migrations para cima, todas para baixo, para
      # cima de novo e conferência das permissões dos roles.
      - name: Bootstrap e migrations (up, rollback, up)
        run: database/postgresql/test-migrations.sh
