var.root = var.CWD
server.document-root = var.root + "/dist"
server.port          = 8090
server.errorlog      = var.root + "/lighttpd-error.log"
server.follow-symlink = "enable"
server.modules += ( "mod_rewrite", "mod_alias" )
alias.url = ( "/landing-2/" => var.root + "/landing-2/" )

# Páginas do site: "/apis" e "/apis/<slug>" entregam o index.src.html (a SPA
# escolhe a página pelo caminho). A lista de slugs é a de src/content/apis.js
# (tests/run.mjs confere); qualquer outro caminho segue para o 404.
url.rewrite-once = (
  "^/apis(/(afrinic|apnic|arin|cgibr|iana|lacnic|ripencc|rootanchors|roothints|rootzone|anatel/pst|ripe/asnames))?/?(\?.*)?$" => "/index.src.html"
)

index-file.names = ( "index.src.html", "index.html", "index.htm" )
dir-listing.activate = "disable"

mimetype.assign = (
  ".html" => "text/html; charset=utf-8",  ".htm"  => "text/html; charset=utf-8",
  ".css"  => "text/css; charset=utf-8",   ".js"   => "text/javascript; charset=utf-8",
  ".mjs"  => "text/javascript; charset=utf-8",
  ".json" => "application/json",          ".map"  => "application/json",
  ".webmanifest" => "application/manifest+json",
  ".xml"  => "application/xml",           ".txt"  => "text/plain; charset=utf-8",
  ".svg"  => "image/svg+xml",   ".png"  => "image/png",   ".ico"  => "image/x-icon",
  ".jpg"  => "image/jpeg",      ".jpeg" => "image/jpeg",  ".gif"  => "image/gif",
  ".webp" => "image/webp",      ".avif" => "image/avif",
  ".woff" => "font/woff",       ".woff2"=> "font/woff2",
  ".ttf"  => "font/ttf",        ".otf"  => "font/otf",
  ".eot"  => "application/vnd.ms-fontobject",
  ".mp4"  => "video/mp4",       ".webm" => "video/webm",  ".m3u8" => "application/vnd.apple.mpegurl",
  ".ts"   => "video/mp2t",      ".m4s"  => "video/iso.segment",
  ".mp3"  => "audio/mpeg",      ".ogg"  => "audio/ogg",
  ".wasm" => "application/wasm",
  ".pdf"  => "application/pdf",
  ""      => "application/octet-stream"
)
