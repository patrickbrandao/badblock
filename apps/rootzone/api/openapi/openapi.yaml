openapi: 3.1.0
info:
  title: api-rootzone
  version: '0.1.0'
  summary: A zona raiz do DNS (root.zone da InterNIC) em JSON — TLDs delegados, servidores de nome, glue e DS.
  description: |-
    API HTTP (JSON), só de leitura, com a **zona raiz do DNS**, a partir do
    arquivo [`root.zone`](https://www.internic.net/domain/root.zone) da
    InterNIC (~1,4 mil TLDs delegados, ~22 mil registros), que o
    `collector-rootzone` grava nas tabelas `rootzone_*`. Lista os TLDs
    delegados e mostra a delegação de cada um: os servidores de nome (NS),
    o glue A/AAAA de cada servidor e os DS (a cadeia DNSSEC a partir da
    raiz). Pública, sem chave; rate limit por IP no proxy.

    - Nomes em minúsculas e sem o ponto final; IDN na forma ASCII (`xn--p1ai`)
      e, em `tld_unicode`, na forma Unicode (`рф`). IPv6 na forma canônica da
      RFC 5952; digest do DS em hexadecimal maiúsculo.
    - O bloco `zone` das rotas de dados traz o `serial` do SOA da zona que
      está no banco (o mesmo da versão do dataset e do ETag); o SOA inteiro
      está em `/meta`. Os RRSIG não são guardados.
    - Versões são servidores: as rotas de dados respondem no servidor sem
      versão (versão atual, hoje v1) e no servidor `/v1` (v1 fixa), com o
      mesmo conteúdo, o mesmo ETag e a mesma chave de cache. Saúde
      (`/health`, `/status`, `/ping`) e `/openapi.yaml` ficam fora do
      versionamento: só existem no servidor sem versão (declaram `servers`
      próprios).
    - Toda rota com `GET` também aceita `HEAD`; `OPTIONS` responde o preflight
      de CORS (204, `GET, HEAD, OPTIONS`). `/rootzone` redireciona (301) para
      `/rootzone/`; qualquer outro caminho responde 404 em JSON.
    - Todas as respostas levam `X-Content-Type-Options: nosniff`,
      `Referrer-Policy: no-referrer`, `Access-Control-Allow-Origin`,
      `Access-Control-Expose-Headers: ETag, X-Cache, X-Dataset-Version` e
      `Server: badblock-api-rootzone/<versão>`.
    - Erros sempre em JSON `{"error": {"code", "message"}}`, com
      `Cache-Control: no-store`. A validação vem antes de tudo: um pedido
      inválido recebe 400 mesmo antes da primeira carga dos dados.
  license:
    name: MIT
    identifier: MIT
externalDocs:
  description: Especificações da fonte (fonte da verdade)
  url: https://github.com/patrickbrandao/badblock/tree/main/specs/fontes/rootzone
servers:
  - url: https://api.badblock.net.br/rootzone
    description: Produção, versão atual (hoje v1)
  - url: https://api.badblock.net.br/rootzone/v1
    description: Produção, v1 fixa
  - url: http://127.0.0.1:8110/rootzone
    description: Desenvolvimento local, versão atual (porta publicada no loopback pelo docker-compose.yml)
  - url: http://127.0.0.1:8110/rootzone/v1
    description: Desenvolvimento local, v1 fixa
tags:
  - name: dados
    description: Consultas à zona raiz (com ETag e cache no Valkey).
  - name: meta
    description: Índice, estado dos dados (com o SOA) e este manifesto.
  - name: saúde
    description: Saúde do serviço, fora do versionamento.
paths:
  /:
    get:
      operationId: getIndex
      tags: [meta]
      summary: Índice da API
      description: |-
        App, versão do build, caminho de base, versões da API e rotas.
        Responde igual nos dois servidores (`/rootzone/` e `/rootzone/v1/`);
        não consulta o banco nem o Valkey.
      responses:
        '200':
          description: O índice.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
              example:
                app: api-rootzone
                version: '0.1.0'
                base_path: /rootzone
                versions: [v1]
                endpoints:
                  - /rootzone/tlds
                  - /rootzone/tld/{tld}
                  - /rootzone/meta
                  - /rootzone/status
                  - /rootzone/openapi.yaml
                source: https://www.internic.net/domain/root.zone
  /tlds:
    get:
      operationId: listTLDs
      tags: [dados]
      summary: Todos os TLDs delegados
      description: |-
        Os TLDs delegados na zona raiz (~1,4 mil, ~160 KB), em ordem de
        nome, com as contagens da delegação: servidores de nome, quantos
        deles têm glue IPv4 e IPv6, e quantos DS (0 = TLD sem DNSSEC). O
        bloco `zone` traz o serial do SOA da zona.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A lista de TLDs.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Dataset-Version:
              $ref: '#/components/headers/XDatasetVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TLDsResponse'
              examples:
                trecho:
                  summary: GET /rootzone/tlds (trecho — 5 dos 1.438 itens da resposta real)
                  value:
                    zone:
                      serial: 2026092901
                    count: 1438
                    tlds:
                      - tld: aaa
                        tld_unicode: aaa
                        nameservers: 6
                        nameservers_ipv4: 6
                        nameservers_ipv6: 6
                        ds_records: 1
                      - tld: aarp
                        tld_unicode: aarp
                        nameservers: 6
                        nameservers_ipv4: 6
                        nameservers_ipv6: 6
                        ds_records: 1
                      - tld: br
                        tld_unicode: br
                        nameservers: 6
                        nameservers_ipv4: 6
                        nameservers_ipv6: 6
                        ds_records: 1
                      - tld: xn--p1ai
                        tld_unicode: рф
                        nameservers: 6
                        nameservers_ipv4: 6
                        nameservers_ipv6: 6
                        ds_records: 1
                      - tld: zw
                        tld_unicode: zw
                        nameservers: 5
                        nameservers_ipv4: 5
                        nameservers_ipv6: 5
                        ds_records: 0
                    dataset:
                      version: 01a0f073-f7ab-73d8-bf10-586563066827
                      updated_at: '2026-09-30T03:55:26Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /tld/{tld}:
    get:
      operationId: getTLD
      tags: [dados]
      summary: A delegação de um TLD
      description: |-
        Os servidores de nome (NS, com TTL) do TLD, o glue A/AAAA que a zona
        raiz traz de cada servidor (com TTL; lista vazia quando não há) e os
        DS (lista vazia = TLD sem DNSSEC). O TLD vale em qualquer caixa, com
        ou sem o ponto final, em ASCII (`br`, `xn--p1ai`) ou em Unicode
        (`рф`, codificado na URL); todas as formas caem na mesma consulta,
        com o mesmo ETag. `first_seen` e `updated_at` são datas deste banco
        (`rootzone_tld`), não da delegação. 404 se o TLD não está delegado.
      parameters:
        - $ref: '#/components/parameters/TLD'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A delegação do TLD.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Dataset-Version:
              $ref: '#/components/headers/XDatasetVersion'
          content:
            application/json:
              schema:
