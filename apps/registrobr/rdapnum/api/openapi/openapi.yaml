openapi: 3.1.0
info:
  title: api-registrobr-rdapnum
  version: '0.1.0'
  summary: RDAP do registro.br por ASN e bloco, coletado pelo BadBlock.
  description: |
    API HTTP (JSON), pública, do RDAP do registro.br (`https://rdap.registro.br/`)
    de cada ASN e bloco IP brasileiro. Não há arquivo publicado: o
    `collector-registrobr-rdapnum` é uma sonda ativa que consulta o RDAP de
    cada alvo — os ASNs e blocos do `cgibr` (NIC.br) e os que o administrador
    cadastra —, guarda a resposta crua com histórico e a processa em titular
    (com CNPJ e representante legal), contatos (com nome e e-mail), blocos e
    delegações reversas, nas tabelas `registrobr_rdapnum_*` do PostgreSQL.
    Esta API lê essas tabelas.

    - Cada alvo é coletado de novo a cada 7 dias (`scan_interval`). O
      registro.br **trunca** as respostas de quem consulta demais (tira
      e-mails, endereços e o CNPJ e responde 200 mesmo assim); o coletor
      detecta a truncagem e nunca deixa a resposta truncada virar o dado
      processado: o que esta API serve é sempre o da última resposta
      completa. `scan.last_result` `truncated` com `scan.checked_at` antigo
      quer dizer exatamente isso.
    - O bloco `scan` de cada resposta de dados é o alvo que gerou o objeto e o
      estado da coleta dele; `scan.checked_at` é a data do dado.
    - Cache sem versão de dataset: o dado muda um alvo de cada vez, o dia
      inteiro, então a resposta em cache pode ter até 5 min (`REDIS_KEY_TTL`)
      de atraso em relação ao banco. O ETag é o hash do corpo; não existe
      `X-Dataset-Version`.
    - `POST .../refresh` pede uma nova coleta do alvo: entra numa fila que o
      coletor atende antes da fila normal, na taxa normal, sem prazo
      garantido. Responde 202 na hora; o resultado aparece em
      `scan.checked_at` (até 5 min depois, pelo cache). No Traefik, o `POST`
      tem rate limit próprio, mais apertado (6 por minuto por IP, rajada 3).
    - Aviso de uso do NIC.br: "Distribution, commercialization, reproduction,
      and use for advertising or similar purposes are expressly prohibited".
      Os dados, inclusive contatos e e-mails, são servidos por decisão do
      mantenedor (decisão #42 das specs). O IP de saída do coletor nunca
      aparece: a resposta crua sai sem a linha `<hora> - <ip>` do aviso.
    - A API é dona de tudo abaixo do caminho de base (`BASE_PATH`, padrão
      `/registrobr/rdapnum`), que já está nos `servers`. As rotas de dados
      respondem sem versão (versão atual, hoje v1) e no servidor
      `.../registrobr/rdapnum/v1` (v1 fixa), com o mesmo conteúdo, a mesma
      chave de cache e o mesmo ETag.
    - Saúde (`/health`, `/status`, `/ping`) e este manifesto (`/openapi.yaml`)
      ficam fora do versionamento: só existem nos servidores sem `/v1`.
    - Toda rota `GET` também responde `HEAD`; `OPTIONS` em qualquer caminho
      responde o preflight de CORS (204, com `GET, HEAD, POST, OPTIONS`).
    - Todas as respostas levam `X-Content-Type-Options: nosniff`,
      `Referrer-Policy: no-referrer`, `Access-Control-Allow-Origin`
      (`CORS_ORIGIN`, padrão `*`), `Access-Control-Expose-Headers: ETag,
      X-Cache, X-Response-UUID` e `Server: badblock-api-registrobr-rdapnum/<versão>`.
    - Erros são sempre JSON `{"error": {"code", "message"}}` com
      `Cache-Control: no-store`. O caminho de base sem barra redireciona (301)
      para o índice; qualquer outro caminho inexistente responde 404
      `not_found`.
    - Sem chave de acesso; o Traefik aplica rate limit por IP.
  license:
    name: MIT
    identifier: MIT
externalDocs:
  description: Especificações da fonte (fonte da verdade)
  url: https://github.com/patrickbrandao/badblock/tree/main/specs/fontes/registrobr/rdapnum
servers:
  - url: https://api.badblock.net.br/registrobr/rdapnum
    description: Produção, versão atual (hoje v1)
  - url: https://api.badblock.net.br/registrobr/rdapnum/v1
    description: Produção, v1 fixa (só rotas de dados)
  - url: http://127.0.0.1:8114/registrobr/rdapnum
    description: Desenvolvimento local, versão atual (porta API_REGISTROBR_RDAPNUM_HOST_PORT no loopback)
  - url: http://127.0.0.1:8114/registrobr/rdapnum/v1
    description: Desenvolvimento local, v1 fixa (só rotas de dados)
tags:
  - name: dados
    description: ASN, bloco, documento e contato processados, cacheados no Valkey e com ETag.
  - name: cru
    description: A resposta RDAP como o registro.br mandou (sem o IP de saída) e o histórico dela.
  - name: atualização
    description: Pedido de nova coleta de um alvo (202, sem espera).
  - name: meta
    description: Índice, estado da coleta e este manifesto.
  - name: saúde
    description: Verificações de saúde, fora do versionamento.
paths:
  /:
    get:
      operationId: getIndex
      summary: Índice da API
      description: >-
        Nome do app, versão do build, caminho de base, versões da API, lista
        de rotas `GET`, a spec da fonte (`source`), o serviço consultado
        (`upstream`) e as fontes de onde vêm os alvos derivados
        (`derived_from`). Não consulta o banco.
      tags: [meta]
      responses:
        '200':
          description: Índice.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
              example:
                app: api-registrobr-rdapnum
                version: 0.1.0
                base_path: /registrobr/rdapnum
                versions: [v1]
                endpoints:
                  - /registrobr/rdapnum/asn/{asn}
                  - /registrobr/rdapnum/asn/{asn}/raw
                  - /registrobr/rdapnum/asn/{asn}/history
                  - /registrobr/rdapnum/ip/{ip}
                  - /registrobr/rdapnum/prefix/{ip}/{len}
                  - /registrobr/rdapnum/prefix/{ip}/{len}/raw
                  - /registrobr/rdapnum/prefix/{ip}/{len}/history
                  - /registrobr/rdapnum/document/{document}
                  - /registrobr/rdapnum/contact/{handle}
                  - /registrobr/rdapnum/response/{uuid}
                  - /registrobr/rdapnum/meta
                  - /registrobr/rdapnum/status
                  - /registrobr/rdapnum/openapi.yaml
                source: https://github.com/patrickbrandao/badblock/tree/main/specs/fontes/registrobr/rdapnum
                upstream: https://rdap.registro.br/
                derived_from: [cgibr]
        '500':
          $ref: '#/components/responses/InternalError'
  /asn/{asn}:
    get:
      operationId: getASN
      summary: Um ASN com titular, contatos e blocos
      description: >-
        O ASN processado da última resposta completa: titular (com CNPJ e
        representante legal), contatos do ASN e do titular (um item por
        handle e `via`, com os papéis) e os blocos registrados com esse ASN.
        Um alvo ainda sem dado processado (nunca coletado, ou 404 no
        registro.br) responde 200 com os campos do ASN `null`, `contacts` e
        `networks` vazios e o `scan`, que diz o porquê. Fora dos alvos: 404.
      tags: [dados]
      parameters:
        - $ref: '#/components/parameters/ASN'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Alvo do rdapnum.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ASNResponse'
              examples:
                processado:
                  summary: ASN com dado processado (AS61610, 2026-10-21; contato pessoa física trocado)
                  value:
                    asn: 61610
                    handle: '61610'
                    name: ASN61610
                    type: DIRECT ALLOCATION
                    country: BR
                    registered_at: '2023-02-27T15:58:28Z'
                    changed_at: '2023-02-27T15:58:28Z'
                    registrant:
                      handle: '35980592000130'
                      kind: org
                      name: ELEA DATA CENTERS
                      email: null
                      country: BR
                      document: 35.980.592/0001-30
                      document_type: cnpj
                      document_digits: '35980592000130'
                      legal_representative: REPRESENTANTE EXEMPLO
                      registered_at: '2023-02-06T21:58:30Z'
                      changed_at: '2026-04-22T15:11:18Z'
                    contacts:
                      - handle: ROBEL308
                        kind: individual
                        name: CONTATO EXEMPLO
                        email: contato@example.com
                        country: BR
                        document: null
                        document_type: null
                        document_digits: null
                        legal_representative: null
                        registered_at: '2023-02-08T17:39:14Z'
                        changed_at: '2026-07-07T18:30:11Z'
                        roles: [abuse, administrative]
                        via: null
                      - handle: ROBEL308
                        kind: individual
                        name: CONTATO EXEMPLO
                        email: contato@example.com
                        country: BR
                        document: null
                        document_type: null
                        document_digits: null
                        legal_representative: null
                        registered_at: '2023-02-08T17:39:14Z'
                        changed_at: '2026-07-07T18:30:11Z'
                        roles: [administrative]
                        via: '35980592000130'
                    networks:
                      - prefix: 187.87.28.0/22
                        type: ALLOCATED
                        status: [active]
                      - prefix: 200.225.48.0/21
                        type: ALLOCATED
                        status: [active]
                      - prefix: 2804:8ae0::/32
                        type: ALLOCATED
                        status: [active]
                    scan:
                      kind: asn
                      target: '61610'
                      source: cgibr
                      active: true
                      checked_at: '2026-10-21T20:36:01Z'
                      attempted_at: '2026-10-21T20:36:01Z'
                      last_result: complete
                      retry_at: null
                      response: 019a0a4e-7c11-7a3e-9b51-6d1c0e7b2a10
                nunca_coletado:
                  summary: Alvo estático ainda não coletado
                  value:
                    asn: 64500
                    handle: null
                    name: null
                    type: null
                    country: null
                    registered_at: null
                    changed_at: null
                    registrant: null
                    contacts: []
                    networks: []
                    scan:
                      kind: asn
                      target: '64500'
                      source: static
                      active: true
                      checked_at: null
                      attempted_at: null
                      last_result: null
                      retry_at: null
                      response: null
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DataUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
  /asn/{asn}/raw:
    get:
      operationId: getASNRaw
      summary: A resposta RDAP atual do ASN
      description: >-
        O corpo RDAP da resposta atual do alvo (a do dado processado), como o
        registro.br mandou, com `Content-Type: application/rdap+json`, menos
        as linhas de `notices[*].description` no formato `<hora> - <ip>` (o IP
        de saída do coletor). Sem resposta atual (nunca coletado, ou 404 no
        registro.br): 404.
      tags: [cru]
      parameters:
        - $ref: '#/components/parameters/ASN'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/Raw'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DataUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
  /asn/{asn}/history:
    get:
      operationId: getASNHistory
      summary: O histórico das respostas do ASN
      description: >-
        Todas as versões da resposta do alvo, a mais nova primeiro (uma versão
        nova só quando o corpo mudou), com o resultado, o hash, o tamanho, as
        datas e se foi processada. Sem o IP de saída nem a hora do servidor.
      tags: [cru]
      parameters:
        - $ref: '#/components/parameters/ASN'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/History'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DataUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
  /asn/{asn}/refresh:
    post:
      operationId: refreshASN
      summary: Pede uma nova coleta do ASN
      description: >-
        Põe o alvo na fila de atualização do Valkey e responde 202 na hora,
        sem esperar a coleta. Coletado há menos de `REFRESH_MIN_AGE` (10 min):
        `queued` false, `reason` `recent`. Pedido do mesmo alvo há menos de
        60 s: `reason` `already_queued`. Alvo desativado: 409. Valkey fora ou
        fila acima de `REFRESH_QUEUE_MAX` (1000): 503. O corpo da requisição
        é ignorado. O cache não é apagado: o dado novo aparece quando a chave
        vence (até 5 min depois da coleta).
      tags: [atualização]
      parameters:
        - $ref: '#/components/parameters/ASN'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/RefreshUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
  /ip/{ip}:
    get:
      operationId: getIP
      summary: O bloco registrado que contém um IP
      description: >-
        O bloco registrado mais específico que contém o IP (consultado como
        `/32` ou `/128`), com titular, contatos, delegações reversas e o
        `scan` do alvo que o gerou. Fora de qualquer bloco: 404.
      tags: [dados]
      parameters:
        - $ref: '#/components/parameters/IP'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/Network'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DataUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
  /prefix/{ip}/{len}:
    get:
      operationId: getPrefix
      summary: O bloco registrado que contém um prefixo
      description: >-
        O bloco registrado mais específico que contém o prefixo pedido (bits
        de host zerados: `/prefix/200.225.48.77/24` consulta
        `200.225.48.0/24`), como em `/ip`. O bloco devolvido pode ser maior
        que o pedido.
      tags: [dados]
      parameters:
        - $ref: '#/components/parameters/PrefixIP'
        - $ref: '#/components/parameters/PrefixLength'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/Network'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DataUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
  /prefix/{ip}/{len}/raw:
    get:
      operationId: getPrefixRaw
      summary: A resposta RDAP atual do alvo de um bloco
      description: >-
        Como `/asn/{asn}/raw`. O alvo é o que tem esse bloco exato ou, sem
        ele, o alvo que gerou o bloco registrado que contém o pedido.
      tags: [cru]
      parameters:
        - $ref: '#/components/parameters/PrefixIP'
        - $ref: '#/components/parameters/PrefixLength'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/Raw'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DataUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
  /prefix/{ip}/{len}/history:
    get:
      operationId: getPrefixHistory
      summary: O histórico das respostas do alvo de um bloco
      description: Como `/asn/{asn}/history`, com o alvo achado como em `/prefix/{ip}/{len}/raw`.
      tags: [cru]
      parameters:
        - $ref: '#/components/parameters/PrefixIP'
        - $ref: '#/components/parameters/PrefixLength'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/History'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DataUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
  /prefix/{ip}/{len}/refresh:
    post:
      operationId: refreshPrefix
      summary: Pede uma nova coleta do alvo de um bloco
      description: >-
        Como `POST /asn/{asn}/refresh`. O alvo é o que tem esse bloco exato
        ou, sem ele, o alvo que gerou o bloco registrado que contém o pedido;
        `target` na resposta é o bloco do alvo.
      tags: [atualização]
      parameters:
        - $ref: '#/components/parameters/PrefixIP'
        - $ref: '#/components/parameters/PrefixLength'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/RefreshUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
  /document/{document}:
    get:
      operationId: getDocument
      summary: Tudo de um CNPJ ou CPF
      description: >-
        As entidades com o documento (em geral uma) e os ASNs e blocos em que
        alguma delas é titular. O documento pode vir com ou sem pontuação
        (`35.980.592/0001-30` ou `35980592000130`; a barra pode ir crua ou
        como `%2F`); os dígitos têm de ser 14 (CNPJ) ou 11 (CPF).
      tags: [dados]
      parameters:
        - $ref: '#/components/parameters/Document'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Documento com alguma entidade no rdapnum.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
              example:
                document_digits: '35980592000130'
                document_type: cnpj
                entities:
                  - handle: '35980592000130'
                    kind: org
                    name: ELEA DATA CENTERS
                    email: null
                    country: BR
                    document: 35.980.592/0001-30
                    document_type: cnpj
                    document_digits: '35980592000130'
                    legal_representative: REPRESENTANTE EXEMPLO
                    registered_at: '2023-02-06T21:58:30Z'
                    changed_at: '2026-04-22T15:11:18Z'
                asns:
                  - asn: 61610
                    name: ASN61610
                    scan:
                      checked_at: '2026-10-21T20:36:01Z'
                networks:
                  - prefix: 187.87.28.0/22
                    asn: 61610
                    type: ALLOCATED
                    status: [active]
                  - prefix: 200.225.48.0/21
                    asn: 61610
                    type: ALLOCATED
                    status: [active]
                  - prefix: 2804:8ae0::/32
                    asn: 61610
                    type: ALLOCATED
                    status: [active]
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DataUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
  /contact/{handle}:
    get:
      operationId: getContact
      summary: Um contato e os objetos em que aparece
      description: >-
        A entidade de um handle (comparação exata; o registro.br usa
        maiúsculas) e os ASNs e blocos em que ela aparece, um item por objeto
        e `via`, com os papéis.
      tags: [dados]
      parameters:
        - $ref: '#/components/parameters/Handle'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Entidade do rdapnum.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
              example:
                entity:
                  handle: ROBEL308
                  kind: individual
                  name: CONTATO EXEMPLO
                  email: contato@example.com
                  country: BR
                  document: null
                  document_type: null
                  document_digits: null
                  legal_representative: null
                  registered_at: '2023-02-08T17:39:14Z'
                  changed_at: '2026-07-07T18:30:11Z'
                objects:
                  - kind: asn
                    asn: 61610
                    prefix: null
                    roles: [abuse, administrative]
                    via: null
                  - kind: asn
                    asn: 61610
                    prefix: null
                    roles: [administrative]
                    via: '35980592000130'
                  - kind: prefix
                    asn: null
                    prefix: 187.87.28.0/22
                    roles: [administrative]
                    via: '35980592000130'
                  - kind: prefix
                    asn: null
                    prefix: 200.225.48.0/21
                    roles: [abuse, technical]
                    via: null
                  - kind: prefix
                    asn: null
                    prefix: 200.225.48.0/21
                    roles: [administrative]
                    via: '35980592000130'
                  - kind: prefix
                    asn: null
                    prefix: 2804:8ae0::/32
                    roles: [abuse, technical]
                    via: null
                  - kind: prefix
                    asn: null
                    prefix: 2804:8ae0::/32
                    roles: [administrative]
