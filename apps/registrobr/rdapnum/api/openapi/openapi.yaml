      description: >-
        Confere o PostgreSQL, o Valkey e se já há algum alvo cadastrado. Mesma
        resposta de `/status`. Sem cache. Precedência: `error` (PostgreSQL
        fora) > `degraded` (Valkey fora) > `starting` (sem alvos) > `ok`.
      tags: [saúde]
      responses:
        '200':
