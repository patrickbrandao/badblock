                error:
                  code: not_found
                  message: resposta 019a0a4e-0000-7000-8000-000000000000 não encontrada
    Conflict:
      description: O alvo está desativado (`active` false); a atualização não vale para ele.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: target_inactive
              message: AS64501 está desativado no rdapnum
    RefreshUnavailable:
      description: >-
        A atualização está indisponível: sem Valkey (`REDIS_URL` vazia) ou
        Valkey fora, ou a fila acima de `REFRESH_QUEUE_MAX`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            valkey:
              summary: Valkey fora
              value:
                error:
                  code: refresh_unavailable
                  message: 'atualização indisponível: Valkey fora do ar'
            queue:
              summary: Fila cheia
              value:
                error:
                  code: refresh_unavailable
                  message: fila de atualização cheia; tente mais tarde
            database_unavailable:
              summary: Falha no PostgreSQL ao achar o alvo
              value:
                error:
                  code: database_unavailable
                  message: banco de dados indisponível
    DataUnavailable:
      description: >-
        Dados indisponíveis: nenhum alvo cadastrado ainda
        (`dataset_not_ready`) ou o PostgreSQL falhou (`database_unavailable`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            dataset_not_ready:
              summary: Antes do primeiro alvo
              value:
                error:
                  code: dataset_not_ready
                  message: 'nenhum alvo cadastrado ainda: a primeira derivação do collector-registrobr-rdapnum não terminou; tente em alguns minutos'
            database_unavailable:
              summary: Falha no PostgreSQL
              value:
                error:
                  code: database_unavailable
                  message: banco de dados indisponível
    DatabaseUnavailable:
      description: Falha no PostgreSQL.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: database_unavailable
              message: banco de dados indisponível
    Timeout:
      description: A consulta passou de `DB_TIMEOUT` (padrão 5s).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: timeout
              message: a consulta demorou demais
    InternalError:
      description: Panic no handler (registrado no log).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: erro interno
    StatusOK:
      description: >-
        API no ar: `ok`, `starting` (nenhum alvo ainda) ou `degraded` (Valkey
        fora; a API segue sem cache e sem atualização).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
          examples:
            ok:
              summary: Tudo no ar
              value:
                success: true
                status: ok
                timestamp: '2026-10-21T21:00:00Z'
                message: api-registrobr-rdapnum operacional
                checks:
                  dataset: ok
                  postgres: ok
                  valkey: ok
            starting:
              summary: Nenhum alvo ainda
              value:
                success: true
                status: starting
                timestamp: '2026-10-21T21:00:00Z'
                message: aguardando a primeira derivação do collector-registrobr-rdapnum
                checks:
                  dataset: empty
                  postgres: ok
                  valkey: ok
            degraded:
              summary: Valkey fora
              value:
                success: true
                status: degraded
                timestamp: '2026-10-21T21:00:00Z'
                message: Valkey indisponível; respondendo sem cache e sem atualização
                checks:
                  dataset: ok
                  postgres: ok
                  valkey: error
    StatusError:
      description: PostgreSQL fora (`success` é `false`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
          example:
            success: false
            status: error
            timestamp: '2026-10-21T21:00:00Z'
            message: PostgreSQL indisponível
            checks:
              dataset: ok
              postgres: error
              valkey: ok
  schemas:
    Scan:
      type: object
      description: >-
        O alvo que gerou o objeto e o estado da coleta dele; acompanha toda
        resposta de dados (no lugar do `dataset` das outras APIs).
        `last_result` `truncated` com `checked_at` antigo: a última tentativa
        veio truncada, e o dado mostrado é o da última completa.
      required: [kind, target, source, active, checked_at, attempted_at, last_result, retry_at, response]
      properties:
        kind:
          type: string
          enum: [asn, prefix]
        target:
          type: string
          description: O ASN (`"61610"`) ou o bloco consultado (`"200.225.48.0/21"`).
          example: '61610'
        source:
          type: string
          enum: [cgibr, static]
          description: '`cgibr` = derivado do cgibr; `static` = cadastrado pelo administrador.'
        active:
          type: boolean
          description: '`false` = fora da coleta e da atualização; o dado continua servido.'
        checked_at:
          type: [string, 'null']
          format: date-time
          description: Última coleta conclusiva (completa ou 404) — a data do dado; `null` = nunca.
        attempted_at:
          type: [string, 'null']
          format: date-time
          description: Última tentativa, conclusiva ou não.
        last_result:
          type: [string, 'null']
          enum: [complete, truncated, not_found, error, null]
          description: Resultado da última tentativa; `null` = nunca tentado.
        retry_at:
          type: [string, 'null']
          format: date-time
          description: Próxima tentativa depois de truncada ou erro; `null` sem espera.
        response:
          type: [string, 'null']
          format: uuid
          description: '`uuid` da resposta atual (a do dado); `null` sem ela.'
    Entity:
      type: object
      description: O titular ou um contato (`registrobr_rdapnum_entity`).
      required: [handle, kind, name, email, country, document, document_type, document_digits, legal_representative, registered_at, changed_at]
      properties:
        handle:
          type: string
          description: O CNPJ só com dígitos (titular) ou o handle do contato.
          example: ROBEL308
        kind:
          type: [string, 'null']
          description: vCard `kind` (`org`, `individual`).
        name:
          type: [string, 'null']
          description: vCard `fn`.
        email:
          type: [string, 'null']
          description: O primeiro e-mail do vCard, em minúsculas.
        country:
          type: [string, 'null']
        document:
          type: [string, 'null']
          description: CNPJ ou CPF como publicado (`35.980.592/0001-30`).
        document_type:
          type: [string, 'null']
          description: '`cnpj`, `cpf` ou o que vier, em minúsculas.'
        document_digits:
          type: [string, 'null']
          description: Só os dígitos do documento.
        legal_representative:
          type: [string, 'null']
        registered_at:
          type: [string, 'null']
          format: date-time
        changed_at:
          type: [string, 'null']
          format: date-time
    Contact:
      description: >-
        Uma entidade com os papéis dela neste objeto. Um item por (`handle`,
        `via`), ordenados por `via` (`null` primeiro) e `handle`.
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          required: [roles, via]
          properties:
            roles:
              type: array
              description: Papéis neste objeto, em ordem alfabética.
              items:
                type: string
              example: [abuse, administrative]
            via:
              type: [string, 'null']
              description: Handle da entidade dentro da qual veio (o titular); `null` = contato do próprio objeto.
    NetworkBrief:
      type: object
      description: Um bloco registrado com o ASN.
      required: [prefix, type, status]
      properties:
        prefix:
          type: string
          example: 200.225.48.0/21
        type:
          type: [string, 'null']
          example: ALLOCATED
        status:
          type: array
          items:
            type: string
          example: [active]
    ASNResponse:
      type: object
      description: Resposta de `GET /asn/{asn}`; campos do ASN `null` enquanto não há dado processado.
      required: [asn, handle, name, type, country, registered_at, changed_at, registrant, contacts, networks, scan]
      properties:
        asn:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
        handle:
          type: [string, 'null']
        name:
          type: [string, 'null']
        type:
          type: [string, 'null']
          example: DIRECT ALLOCATION
        country:
          type: [string, 'null']
        registered_at:
          type: [string, 'null']
          format: date-time
        changed_at:
          type: [string, 'null']
          format: date-time
        registrant:
          oneOf:
            - $ref: '#/components/schemas/Entity'
            - type: 'null'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        networks:
          type: array
          description: Blocos registrados com este ASN, IPv4 primeiro.
          items:
            $ref: '#/components/schemas/NetworkBrief'
        scan:
          $ref: '#/components/schemas/Scan'
    Nameserver:
      type: object
      required: [name, status, checked_at, last_ok_at]
      properties:
        name:
          type: [string, 'null']
          example: keenan.ns.cloudflare.com
        status:
          type: array
          items:
            type: string
          example: [ns aa]
        checked_at:
          type: [string, 'null']
          description: Última verificação da delegação pelo registro.br.
        last_ok_at:
          type: [string, 'null']
          description: Última verificação correta.
    Reverse:
      type: object
      description: Uma delegação reversa do bloco.
      required: [prefix, start_address, end_address, nameservers, signed, registered_at, changed_at]
      properties:
        prefix:
          type: [string, 'null']
          description: A faixa como CIDR, quando é exata; `null` senão.
          example: 200.225.48.0/24
        start_address:
          type: string
          format: ip
        end_address:
          type: string
          format: ip
        nameservers:
          type: array
          items:
            $ref: '#/components/schemas/Nameserver'
        signed:
          type: [boolean, 'null']
          description: '`secureDNS.delegationSigned`.'
        registered_at:
          type: [string, 'null']
          format: date-time
        changed_at:
          type: [string, 'null']
          format: date-time
    NetworkResponse:
      type: object
      description: Resposta de `GET /ip/{ip}` e `GET /prefix/{ip}/{len}`.
      required: [query, prefix, start_address, end_address, ip_version, handle, name, type, country, status, parent_handle, asn, registered_at, changed_at, registrant, contacts, reverse, scan]
      properties:
        query:
          type: string
          description: O IP ou prefixo pedido, normalizado.
        prefix:
          type: string
          description: O bloco registrado mais específico que contém o pedido.
        start_address:
          type: string
          format: ip
        end_address:
          type: string
          format: ip
        ip_version:
          type: integer
          enum: [4, 6]
        handle:
          type: [string, 'null']
        name:
          type: [string, 'null']
          description: Um número interno do registro.br.
        type:
          type: [string, 'null']
        country:
          type: [string, 'null']
        status:
          type: array
          items:
            type: string
        parent_handle:
          type: [string, 'null']
        asn:
          type: [integer, 'null']
          format: int64
          description: '`nicbr_autnum` do bloco.'
        registered_at:
          type: [string, 'null']
          format: date-time
        changed_at:
          type: [string, 'null']
          format: date-time
        registrant:
          oneOf:
            - $ref: '#/components/schemas/Entity'
            - type: 'null'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        reverse:
          type: array
          items:
            $ref: '#/components/schemas/Reverse'
        scan:
          $ref: '#/components/schemas/Scan'
    DocumentResponse:
      type: object
      description: Resposta de `GET /document/{document}`.
      required: [document_digits, document_type, entities, asns, networks]
      properties:
        document_digits:
          type: string
        document_type:
          type: string
          enum: [cnpj, cpf]
          description: Pelo número de dígitos (14 ou 11).
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        asns:
          type: array
          description: ASNs em que alguma das entidades é titular.
          items:
            type: object
            required: [asn, name, scan]
            properties:
              asn:
                type: integer
                format: int64
              name:
                type: [string, 'null']
              scan:
                type: object
                required: [checked_at]
                properties:
                  checked_at:
                    type: [string, 'null']
                    format: date-time
        networks:
          type: array
          description: Blocos em que alguma das entidades é titular.
          items:
            type: object
            required: [prefix, asn, type, status]
            properties:
              prefix:
                type: string
              asn:
                type: [integer, 'null']
                format: int64
              type:
                type: [string, 'null']
              status:
                type: array
                items:
                  type: string
    ContactObject:
      type: object
      description: Um objeto em que o contato aparece (um item por objeto e `via`).
      required: [kind, asn, prefix, roles, via]
      properties:
        kind:
          type: string
          enum: [asn, prefix]
        asn:
          type: [integer, 'null']
          format: int64
          description: O ASN, quando `kind` é `asn`.
        prefix:
          type: [string, 'null']
          description: O bloco, quando `kind` é `prefix`.
        roles:
          type: array
          items:
            type: string
        via:
          type: [string, 'null']
    ContactResponse:
      type: object
      description: Resposta de `GET /contact/{handle}`.
      required: [entity, objects]
      properties:
        entity:
          $ref: '#/components/schemas/Entity'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/ContactObject'
    HistoryItem:
      type: object
      description: Uma versão da resposta (sem o IP de saída nem a hora do servidor).
      required: [uuid, result, http_status, sha256, bytes, fetched_at, last_seen_at, seen_count, processed, process_error]
      properties:
        uuid:
          type: string
          format: uuid
        result:
          type: string
          enum: [complete, truncated, not_found]
        http_status:
          type: integer
          enum: [200, 404]
        sha256:
          type: string
          description: SHA-256 do corpo sem `notices`, com as chaves em ordem.
        bytes:
          type: integer
        fetched_at:
          type: string
          format: date-time
          description: Primeira vez que esta versão chegou.
        last_seen_at:
          type: string
          format: date-time
          description: Última vez que chegou igual.
        seen_count:
          type: integer
        processed:
          type: boolean
          description: Já processada (truncadas nunca são).
        process_error:
          type: [string, 'null']
          description: Por que o processamento recusou; `null` se deu certo ou não foi tentado.
    HistoryResponse:
      type: object
      description: Resposta de `GET .../history`.
      required: [target, kind, current, responses]
      properties:
        target:
          type: string
        kind:
          type: string
          enum: [asn, prefix]
        current:
          type: [string, 'null']
          format: uuid
          description: '`uuid` da resposta atual; `null` sem ela.'
        responses:
          type: array
          description: A mais nova primeiro.
          items:
            $ref: '#/components/schemas/HistoryItem'
    RawResponse:
      type: object
      description: >-
        Corpo RDAP (RFC 9083) como o registro.br mandou, sem as linhas do IP
        de saída em `notices[*].description`; objeto livre.
      additionalProperties: true
    NotFoundResponse:
      type: object
      description: Uma versão `not_found` em `GET /response/{uuid}`.
      required: [result, http_status]
      properties:
        result:
          type: string
          const: not_found
        http_status:
          type: integer
          const: 404
    RefreshResponse:
      type: object
      description: Resposta 202 do `POST .../refresh`.
      required: [kind, target, queued, reason, checked_at]
      properties:
        kind:
          type: string
          enum: [asn, prefix]
        target:
          type: string
          description: O ASN ou o bloco do alvo.
        queued:
          type: boolean
        reason:
          type: [string, 'null']
          enum: [recent, already_queued, null]
          description: Por que não entrou na fila; `null` quando entrou.
        checked_at:
          type: [string, 'null']
          format: date-time
          description: A última coleta conclusiva do alvo (antes deste pedido).
    MetaResponse:
      type: object
      description: Resposta de `GET /meta`.
      required: [app, version, targets, responses, data, config, derivations, workers, collector, refresh]
      properties:
        app:
          type: string
          const: api-registrobr-rdapnum
        version:
          type: string
        targets:
          $ref: '#/components/schemas/MetaTargets'
        responses:
          $ref: '#/components/schemas/MetaResponses'
        data:
          type: object
          description: Linhas das tabelas processadas.
          required: [autnum, network, entity, reverse]
          properties:
            autnum:
              type: integer
              format: int64
            network:
              type: integer
              format: int64
            entity:
              type: integer
              format: int64
            reverse:
              type: integer
              format: int64
        config:
          $ref: '#/components/schemas/MetaConfig'
        derivations:
          type: array
          description: A última derivação aplicada; `[]` antes da primeira.
          items:
            $ref: '#/components/schemas/MetaDerivation'
        workers:
          type: array
          description: Instâncias do coletor com sinal nas últimas 24 h (sem o IP de saída).
          items:
            $ref: '#/components/schemas/MetaWorker'
        collector:
          description: Linha do coletor em `jobs`; `null` se ainda não existe.
          oneOf:
            - $ref: '#/components/schemas/MetaCollector'
            - type: 'null'
        refresh:
          type: object
          required: [queue]
          properties:
            queue:
              type: [integer, 'null']
              minimum: 0
              description: Pedidos na fila de atualização (`LLEN`); `null` sem Valkey.
    MetaTargets:
      type: object
      description: >-
        Resumo dos alvos. `never_scanned`, `overdue`, `rescan` e
        `oldest_scan_at` contam só os ativos (os que a fila pega); `overdue`
        usa `config.scan_interval` ou, sem ele, 168h. `complete`,
        `truncated`, `not_found` e `error` são o `last_result`.
      required: [total, asn, prefix, active, static, never_scanned, overdue, rescan, scanning, waiting, oldest_scan_at, complete, truncated, not_found, error]
      properties:
        total:
          type: integer
        asn:
          type: integer
        prefix:
          type: integer
        active:
          type: integer
        static:
          type: integer
        never_scanned:
          type: integer
        overdue:
          type: integer
        rescan:
          type: integer
          description: Pedidos de nova coleta pendentes (inclusive os da atualização).
        scanning:
          type: integer
          description: Alvos com uma instância consultando.
        waiting:
          type: integer
          description: Alvos em espera depois de truncada ou erro (`retry_at` no futuro).
        oldest_scan_at:
          type: [string, 'null']
          format: date-time
        complete:
          type: integer
        truncated:
          type: integer
        not_found:
          type: integer
        error:
          type: integer
    MetaResponses:
      type: object
      description: Resumo das respostas guardadas.
      required: [total, complete, truncated, not_found, pending, process_errors]
      properties:
        total:
          type: integer
          format: int64
        complete:
          type: integer
          format: int64
        truncated:
          type: integer
          format: int64
        not_found:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
          description: Respostas conclusivas atuais ainda sem processar.
        process_errors:
          type: integer
          format: int64
    MetaConfig:
      type: object
      description: >-
        `registrobr_rdapnum_config`; `null` = sem linha (ou valor inválido):
        cada coletor usa a reserva do ambiente (`RATE_LIMIT`, `SCAN_INTERVAL`).
      required: [rate_limit, scan_interval]
      properties:
        rate_limit:
          type: [integer, 'null']
          minimum: 1
          description: Consultas por minuto, por coletor.
          example: 32
        scan_interval:
          type: [string, 'null']
          description: Meta por alvo, em duração Go.
          example: 168h
    MetaDerivation:
      type: object
      description: A última derivação aplicada (linha de `registrobr_rdapnum_run`).
      required: [source, version, source_version, source_updated_at, created_at, asns, prefixes, inserted, not_in_source]
      properties:
        source:
          type: string
          enum: [cgibr]
        version:
          type: string
          format: uuid
        source_version:
          type: string
          format: uuid
          description: A versão do cgibr que foi lida (`cgibr_run.uuid`).
        source_updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        asns:
          type: [integer, 'null']
        prefixes:
          type: [integer, 'null']
        inserted:
          type: [integer, 'null']
        not_in_source:
          type: [integer, 'null']
          description: Alvos `cgibr` que esta versão não traz mais (continuam cadastrados).
    MetaWorker:
      type: object
      description: Uma instância do coletor, sem o IP de saída nem a URL do proxy.
      required: [host, version, started_at, seen_at, alive, rate_limit, proxy, requests, complete, truncated, not_found, errors, refreshes, egress_ips, paused_until]
      properties:
        host:
          type: string
        version:
          type: string
        started_at:
          type: string
          format: date-time
        seen_at:
          type: string
          format: date-time
        alive:
          type: boolean
          description: Sinal há menos de 90 s.
        rate_limit:
          type: integer
          description: Taxa em vigor, em consultas por minuto.
        proxy:
          type: boolean
          description: Sai por um proxy (`PROXY_URL`).
        requests:
          type: integer
          format: int64
        complete:
          type: integer
          format: int64
        truncated:
          type: integer
          format: int64
        not_found:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        refreshes:
          type: integer
          format: int64
          description: Pedidos de atualização atendidos.
        egress_ips:
          type: integer
          description: IPs de saída distintos nas últimas 100 respostas (só a contagem).
        paused_until:
          type: [string, 'null']
          format: date-time
          description: Pausa por truncadas seguidas.
    MetaCollector:
      type: object
      description: Linha do coletor na tabela central `jobs`.
      required: [app, last_sync_at, last_check_at, consolidated]
      properties:
        app:
          type: string
          const: collector-registrobr-rdapnum
        last_sync_at:
          type: [string, 'null']
          format: date-time
        last_check_at:
          type: [string, 'null']
          format: date-time
        consolidated:
          type: boolean
    Status:
      type: object
      description: Resposta de `/health` e `/status`.
      required: [success, status, timestamp, message, checks]
      properties:
        success:
          type: boolean
          description: '`false` só quando o PostgreSQL está fora.'
        status:
          type: string
          enum: [ok, starting, degraded, error]
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        checks:
          $ref: '#/components/schemas/StatusChecks'
    StatusChecks:
      type: object
      required: [postgres, valkey, dataset]
      properties:
        postgres:
          type: string
          enum: [ok, error]
        valkey:
          type: string
          enum: [ok, error, disabled]
          description: '`disabled` sem cache e sem atualização.'
        dataset:
          type: string
          enum: [ok, empty]
          description: '`empty` enquanto não há nenhum alvo cadastrado.'
    IndexResponse:
      type: object
      description: Resposta do índice (`GET /`, na versão atual e na v1 fixa).
      required: [app, version, base_path, versions, endpoints, source, upstream, derived_from]
      properties:
        app:
          type: string
          const: api-registrobr-rdapnum
        version:
          type: string
        base_path:
          type: string
          example: /registrobr/rdapnum
        versions:
          type: array
          items:
            type: string
        endpoints:
          type: array
          description: As rotas GET de dados, o /meta, o /status e o manifesto.
          items:
            type: string
        source:
          type: string
          format: uri
          description: As specs da fonte (não há arquivo publicado).
        upstream:
          type: string
          format: uri
          description: O serviço RDAP consultado pelo coletor.
        derived_from:
          type: array
          items:
            type: string
          example: [cgibr]
    Error:
      type: object
      description: Corpo de toda resposta de erro.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, not_found, dataset_not_ready, database_unavailable, timeout, internal_error, target_inactive, refresh_unavailable]
              example: not_found
            message:
              type: string
              description: Mensagem em português para pessoas.
              example: AS1 não é alvo do rdapnum
