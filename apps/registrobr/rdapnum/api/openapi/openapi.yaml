components:
  parameters:
    ASN:
      name: asn
      in: path
      required: true
      description: >-
        Número do ASN, de 0 a 4294967295, com ou sem `AS`/`as` na frente
        (`61610`, `AS61610`). O resto responde 400 `ASN inválido`.
      schema:
        type: string
        pattern: '^(AS|as)?[0-9]+$'
      example: '61610'
    IP:
      name: ip
      in: path
      required: true
      description: >-
        Endereço IPv4 ou IPv6. O IPv4 mapeado em IPv6 (`::ffff:200.225.48.10`)
        vira IPv4. Inválido responde 400 `endereço IP inválido`.
      schema:
        type: string
        format: ip
      example: 200.225.48.10
    PrefixIP:
      name: ip
      in: path
      required: true
      description: >-
        Endereço do prefixo, IPv4 ou IPv6 (as mesmas regras de `ip`). Os bits
        de host são zerados (`200.225.48.77/24` vira `200.225.48.0/24`).
      schema:
        type: string
        format: ip
      example: 200.225.48.0
    PrefixLength:
      name: len
      in: path
      required: true
      description: >-
        Tamanho do prefixo: de 0 a 32 (IPv4) ou de 0 a 128 (IPv6). Fora da
        faixa ou não numérico responde 400 `tamanho de prefixo inválido`.
      schema:
        type: integer
        minimum: 0
        maximum: 128
      example: 24
    Document:
      name: document
      in: path
      required: true
      description: >-
        CNPJ ou CPF, com ou sem pontuação (`.`, `/`, `-`); os dígitos têm de
        ser 14 ou 11. O resto responde 400 `documento inválido: use CNPJ (14
        dígitos) ou CPF (11)`.
      schema:
        type: string
      example: '35980592000130'
    Handle:
      name: handle
      in: path
      required: true
      description: >-
        Handle da entidade: de 1 a 64 caracteres `[A-Za-z0-9._-]`. O resto
        responde 400 `handle inválido`.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
      example: ROBEL308
    ResponseUUID:
      name: uuid
      in: path
      required: true
      description: '`uuid` de uma versão da resposta (do histórico). Inválido responde 400 `uuid inválido`.'
      schema:
        type: string
        format: uuid
      example: 019a0a4e-7c11-7a3e-9b51-6d1c0e7b2a10
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        ETag de uma resposta anterior (lista separada por vírgula, ou `*`; a
        comparação ignora o `W/`). Se bater com o ETag do corpo atual, responde
        304 sem corpo. O corpo é lido do cache (ou do banco) para comparar.
      schema:
        type: string
      example: W/"625c765155159382"
  headers:
    ETag:
      description: >-
        ETag fraco, `W/"<hash>"`: o FNV-1a de 64 bits do corpo, em
        hexadecimal minúsculo. Muda quando o corpo muda.
      schema:
        type: string
      example: W/"625c765155159382"
    CacheControlPublic:
      description: Resposta cacheável por 5 minutos.
      schema:
        type: string
        const: public, max-age=300
      example: public, max-age=300
    CacheControlImmutable:
      description: Uma versão do histórico não muda; cacheável por um dia.
      schema:
        type: string
        const: public, max-age=86400
      example: public, max-age=86400
    CacheControlNoStore:
      description: Resposta que não deve ser guardada em cache.
      schema:
        type: string
        const: no-store
      example: no-store
    XCache:
      description: >-
        Origem da resposta: `HIT` (Valkey), `MISS` (lida do banco agora e
        guardada no Valkey) ou `BYPASS` (cache desligado, ou o `POST` de
        atualização). No 304, de onde veio o corpo comparado.
      schema:
        type: string
        enum: [HIT, MISS, BYPASS]
      example: MISS
    XResponseUUID:
      description: '`uuid` da versão da resposta servida.'
      schema:
        type: string
        format: uuid
      example: 019a0a4e-7c11-7a3e-9b51-6d1c0e7b2a10
    LastModified:
      description: Última vez que essa versão chegou igual do registro.br (`last_seen_at`).
      schema:
        type: string
      example: Wed, 21 Oct 2026 20:36:01 GMT
  responses:
    NotModified:
      description: O ETag enviado em `If-None-Match` é o do corpo atual; sem corpo.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControlPublic'
        X-Cache:
          $ref: '#/components/headers/XCache'
    Network:
