openapi: 3.1.0
info:
  title: api-iana
  version: 0.1.0
  description: |
    API HTTP (JSON), só leitura, dos registros de numeração da IANA coletados
    pelo `collector-iana` do BadBlock (tabelas `iana_*`): a quem cada faixa de
    ASN e cada bloco IP (os /8 do IPv4 e os blocos do IPv6 unicast) foi
    entregue (RIR, status, WHOIS, RDAP), os registros de uso especial
    (special-purpose) de IPv4, IPv6 e ASN, que sustentam a regra de **bogon**,
    e o bootstrap RDAP (RFC 9224). Fonte: https://www.iana.org/numbers.

    Versões: os servidores sem `/v1` servem a versão atual (hoje v1); os
    servidores com `/v1` fixam a v1 (`/iana/v1/asn/61613`), com o mesmo
    conteúdo, a mesma chave de cache e o mesmo ETag. Cada rota aparece uma vez
    em `paths`, relativa ao servidor. Saúde (`/health`, `/status`, `/ping`) e
    este manifesto (`/openapi.yaml`) ficam fora do versionamento: sobrescrevem
    `servers` só com os servidores sem `/v1`.

    Todo `GET` também aceita `HEAD`. `OPTIONS` em qualquer caminho responde o
    preflight de CORS (`204`, `Access-Control-Allow-Methods: GET, HEAD,
    OPTIONS`). `/iana` redireciona (`301`) para `/iana/`; qualquer outro
    caminho ou método responde `404` com `code` `not_found`.

    Em todas as respostas: `X-Content-Type-Options: nosniff`,
    `Referrer-Policy: no-referrer`, `Access-Control-Allow-Origin` (padrão
    `*`), `Access-Control-Expose-Headers: ETag, X-Cache, X-Dataset-Version` e
    `Server: badblock-api-iana/<versão>`. Erros sempre em JSON
    `{"error": {"code", "message"}}`, com `Cache-Control: no-store`.

    Pública, sem chave; rate limit por IP no Traefik.
  license:
    name: MIT
    identifier: MIT
externalDocs:
  description: Especificações da fonte (fonte da verdade)
  url: https://github.com/patrickbrandao/badblock/tree/main/specs/fontes/iana
servers:
  - url: https://api.badblock.net.br/iana
    description: Produção, versão atual (hoje v1)
  - url: https://api.badblock.net.br/iana/v1
    description: Produção, v1 fixa (só o índice, as rotas de dados e o /meta)
  - url: http://127.0.0.1:8107/iana
    description: Desenvolvimento local, versão atual (porta API_IANA_HOST_PORT no loopback)
  - url: http://127.0.0.1:8107/iana/v1
    description: Desenvolvimento local, v1 fixa
tags:
  - name: dados
    description: Consultas e listas dos registros da IANA (com ETag, `X-Cache` e cache no Valkey).
  - name: meta
    description: Índice da API, estado dos dados e este manifesto.
  - name: saúde
    description: Healthchecks, fora do versionamento e sem cache.
paths:
  /:
    get:
      operationId: getIndex
      tags: [meta]
      summary: Índice da API
      description: |
        App, versão do build, caminho de base, versões da API e rotas.
        `/iana/` e `/iana/v1/` respondem o mesmo.
      responses:
        '200':
          description: Índice.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
              example:
                app: api-iana
                version: 0.1.0
                base_path: /iana
                versions: [v1]
                endpoints:
                  - /iana/asn/{asn}
                  - /iana/ip/{ip}
                  - /iana/prefix/{ip}/{len}
                  - /iana/asns
                  - /iana/ipv4
                  - /iana/ipv6
                  - /iana/special
                  - /iana/rdap
                  - /iana/meta
                  - /iana/status
                  - /iana/openapi.yaml
                source: https://www.iana.org/numbers
  /asn/{asn}:
    get:
      operationId: getASN
      tags: [dados]
      summary: Consulta um ASN
      description: |
        A faixa de `as-numbers-1`/`-2` que contém o ASN (`block`), as faixas
        de `special-purpose-as-numbers` que o contêm (`special`, em ordem de
        início) e a entrada do bootstrap RDAP (`asn.json`) que o contém
        (`rdap`). Nunca responde 404 para um ASN válido: o que a IANA não diz
        sai `null`/`[]` (`block` só é `null` com dados incompletos; faixas
        reservadas e não alocadas não têm `rdap`).
      parameters:
        - $ref: '#/components/parameters/ASN'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: O que a IANA diz sobre o ASN.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Dataset-Version:
              $ref: '#/components/headers/XDatasetVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ASNResponse'
              examples:
                lacnic:
                  summary: GET /asn/61613
                  value:
                    asn: 61613
                    block:
                      start: 61440
                      end: 61951
                      description: Assigned by LACNIC
                      registry: lacnic
                      whois: whois.lacnic.net
                      rdap_urls: [https://rdap.lacnic.net/rdap/]
                      reference: null
                      registration_date: '2013-06-11'
                    special: []
                    rdap:
                      resource: 61440-61951
                      registry: lacnic
                      urls: [https://rdap.lacnic.net/rdap/]
                    dataset:
                      version: 01a0eaa2-fd5c-7c24-bc6c-4e3c35d61c53
                      updated_at: '2026-09-29T00:49:05Z'
                as_trans:
                  summary: GET /asn/AS23456
                  value:
                    asn: 23456
                    block:
                      start: 23456
                      end: 23456
                      description: AS_TRANS
                      registry: null
                      whois: null
                      rdap_urls: []
                      reference: '[RFC6793]'
                      registration_date: null
                    special:
                      - start: 23456
                        end: 23456
                        reason: AS_TRANS; reserved by [RFC6793]
                        reference: '[RFC6793]'
                    rdap: null
                    dataset:
                      version: 01a0eaa2-fd5c-7c24-bc6c-4e3c35d61c53
                      updated_at: '2026-09-29T00:49:05Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatasetUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /ip/{ip}:
    get:
      operationId: getIP
      tags: [dados]
      summary: Consulta um IP
      description: |
        O bloco mais específico de `ipv4-address-space` (/8) ou
        `ipv6-unicast-address-assignments` que contém o IP (`block`, `null`
        fora deles), **todas** as entradas dos special-purpose registries
        que o contêm, da mais específica para a menos, inclusive as
        encerradas (`special`), se é **bogon** (`bogon`) e a entrada mais
        específica do bootstrap RDAP que o contém (`rdap`). Nunca responde
        404 para um IP válido.

        Regra de bogon (`store.PrefixLookup.Bogon`), avaliada em ordem:

        1. Entre as entradas de `special` **em vigor** (`termination_date`
           nulo), a mais específica decide se tiver `globally_reachable`
           preenchido: `false` = bogon, `true` = não bogon (ex.:
           `192.0.0.9/32`, `true`, vale dentro de `192.0.0.0/24`, `false`).
           Se ela tem `globally_reachable` nulo (a IANA publica `N/A`:
           TEREDO `2001::/32`, 6to4 `2002::/16`), vale a regra 2. Entradas
           encerradas não contam.
        2. Bogon se nenhum bloco da IANA que cruza a consulta tem status
           diferente de `RESERVED`: a consulta está toda em blocos
           `RESERVED` (0/8, 10/8, 127/8, 224–255...) ou fora de qualquer
           bloco (IPv6 que a IANA não entregou: `ff00::/8`, `4000::/3`...).

        Marca o espaço reservado (bogons clássicos), não o "fullbogon" dos
        RIRs.
      parameters:
        - $ref: '#/components/parameters/IP'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: O que a IANA diz sobre o IP.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Dataset-Version:
              $ref: '#/components/headers/XDatasetVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPResponse'
              examples:
                pcp_anycast:
                  summary: GET /ip/192.0.0.9 (não bogon)
                  value:
                    ip: 192.0.0.9
                    block:
                      prefix: 192.0.0.0/8
                      designation: Administered by ARIN
                      registry: arin
                      status: LEGACY
                      whois: whois.arin.net
                      rdap_urls:
                        - https://rdap.arin.net/registry
                        - http://rdap.arin.net/registry
                      allocation_date: '1993-05'
                      note: '[10][11]'
                    special:
                      - prefix: 192.0.0.9/32
                        name: Port Control Protocol Anycast
                        rfc: '[RFC7723]'
                        allocation_date: '2015-10'
                        termination_date: null
                        source: true
                        destination: true
                        forwardable: true
                        globally_reachable: true
                        reserved_by_protocol: false
                      - prefix: 192.0.0.0/24
                        name: IETF Protocol Assignments
                        rfc: '[RFC6890], Section 2.1'
                        allocation_date: '2010-01'
                        termination_date: null
                        source: false
                        destination: false
                        forwardable: false
                        globally_reachable: false
                        reserved_by_protocol: false
                    bogon: false
                    rdap:
                      resource: 192.0.0.0/8
                      registry: arin
                      urls:
                        - https://rdap.arin.net/registry/
                        - http://rdap.arin.net/registry/
                    dataset:
                      version: 01a0eaa2-fd5c-7c24-bc6c-4e3c35d61c53
                      updated_at: '2026-09-29T00:49:05Z'
                private_use:
                  summary: GET /ip/10.0.0.1 (bogon)
                  value:
                    ip: 10.0.0.1
                    block:
                      prefix: 10.0.0.0/8
                      designation: IANA - Private Use
                      registry: null
                      status: RESERVED
                      whois: null
                      rdap_urls: []
                      allocation_date: '1995-06'
                      note: '[4]'
                    special:
                      - prefix: 10.0.0.0/8
                        name: Private-Use
                        rfc: '[RFC1918]'
                        allocation_date: '1996-02'
                        termination_date: null
                        source: true
                        destination: true
                        forwardable: true
                        globally_reachable: false
                        reserved_by_protocol: false
                    bogon: true
                    rdap: null
                    dataset:
                      version: 01a0eaa2-fd5c-7c24-bc6c-4e3c35d61c53
                      updated_at: '2026-09-29T00:49:05Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatasetUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /prefix/{ip}/{len}:
    get:
      operationId: getPrefix
      tags: [dados]
      summary: Consulta um prefixo
      description: |
        Como `/ip`, para um prefixo. Os bits de host são zerados
        (`/prefix/10.1.2.3/16` consulta `10.1.0.0/16`). `block` e `rdap` são
        os mais específicos que **contêm** o prefixo (`null` para um prefixo
        maior que eles, ex.: `8.0.0.0/7`); `special` lista as entradas que
        contêm o prefixo pedido (as que estão dentro dele não entram). `bogon`
        segue a regra do `/ip`, aplicada ao prefixo inteiro (`224.0.0.0/4`
        é bogon: só cruza blocos `RESERVED`; `8.0.0.0/7` não: cruza
        `8.0.0.0/8` `LEGACY`). Nunca responde 404 para um prefixo válido.
      parameters:
        - $ref: '#/components/parameters/PrefixAddress'
        - $ref: '#/components/parameters/PrefixLength'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: O que a IANA diz sobre o prefixo.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Dataset-Version:
              $ref: '#/components/headers/XDatasetVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefixResponse'
              example:
                query: 2001:db8::/48
                block:
                  prefix: 2001:c00::/23
                  designation: APNIC
                  registry: apnic
                  status: ALLOCATED
                  whois: whois.apnic.net
                  rdap_urls: [https://rdap.apnic.net/]
                  allocation_date: '2002-05-02'
                  note: 2001:db8::/32 is reserved for Documentation [RFC3849]. See [IPv6 Special-Purpose Address Space] for details.
                special:
                  - prefix: 2001:db8::/32
                    name: Documentation
                    rfc: '[RFC3849]'
                    allocation_date: '2004-07'
                    termination_date: null
                    source: false
                    destination: false
                    forwardable: false
                    globally_reachable: false
                    reserved_by_protocol: false
                bogon: true
                rdap:
                  resource: 2001:c00::/23
                  registry: apnic
                  urls: [https://rdap.apnic.net/]
                dataset:
                  version: 01a0eaa2-fd5c-7c24-bc6c-4e3c35d61c53
                  updated_at: '2026-09-29T00:49:05Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatasetUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /asns:
    get:
      operationId: getASNs
      tags: [dados]
      summary: Todas as faixas de ASN
      description: |
        As faixas de `as-numbers-1`/`-2` (173, ~35 KB), em ordem numérica, no
        formato de `block` do `/asn`. Sem parâmetros de consulta: a lista vem
        sempre inteira, sem paginação nem filtro (a query string é ignorada).
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Todas as faixas de ASN.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Dataset-Version:
              $ref: '#/components/headers/XDatasetVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ASNBlocksResponse'
              example:
                count: 173
                blocks:
                  - start: 0
                    end: 0
                    description: Reserved
                    registry: null
                    whois: null
                    rdap_urls: []
                    reference: '[RFC7607]'
                    registration_date: null
                  - start: 1
                    end: 1876
                    description: Assigned by ARIN
                    registry: arin
                    whois: whois.arin.net
                    rdap_urls:
                      - https://rdap.arin.net/registry
                      - http://rdap.arin.net/registry
                    reference: null
                    registration_date: null
                dataset:
                  version: 01a0eaa2-fd5c-7c24-bc6c-4e3c35d61c53
                  updated_at: '2026-09-29T00:49:05Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatasetUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /ipv4:
    get:
      operationId: getIPv4
      tags: [dados]
      summary: Todos os blocos IPv4
      description: |
        Os 256 /8 de `ipv4-address-space` (~54 KB), em ordem de endereço, no
        formato de `block` do `/ip`. Sem parâmetros de consulta: a lista vem
        sempre inteira, sem paginação nem filtro (a query string é ignorada).
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Todos os blocos IPv4.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Dataset-Version:
              $ref: '#/components/headers/XDatasetVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefixBlocksResponse'
              example:
                count: 256
                blocks:
                  - prefix: 0.0.0.0/8
                    designation: IANA - Local Identification
                    registry: null
                    status: RESERVED
                    whois: null
                    rdap_urls: []
                    allocation_date: '1981-09'
                    note: '[2][3]'
                dataset:
                  version: 01a0eaa2-fd5c-7c24-bc6c-4e3c35d61c53
                  updated_at: '2026-09-29T00:49:05Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatasetUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /ipv6:
    get:
      operationId: getIPv6
      tags: [dados]
      summary: Todos os blocos IPv6
      description: |
        Os 51 blocos de `ipv6-unicast-address-assignments` (~12 KB), em ordem
        de endereço, no formato de `block` do `/ip`. Sem parâmetros de
        consulta: a lista vem sempre inteira, sem paginação nem filtro (a
        query string é ignorada).
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Todos os blocos IPv6 unicast.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Dataset-Version:
              $ref: '#/components/headers/XDatasetVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefixBlocksResponse'
              example:
                count: 51
                blocks:
                  - prefix: 2001::/23
                    designation: IANA
                    registry: null
                    status: ALLOCATED
                    whois: whois.iana.org
                    rdap_urls: []
                    allocation_date: '1999-07-01'
                    note: This range has been partially allocated. See [IPv6 Special-Purpose Address Space] for details.
                dataset:
                  version: 01a0eaa2-fd5c-7c24-bc6c-4e3c35d61c53
                  updated_at: '2026-09-29T00:49:05Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatasetUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /special:
    get:
      operationId: getSpecial
      tags: [dados]
      summary: Registros de uso especial
      description: |
        Os três special-purpose registries inteiros (~13 KB): blocos IPv4 (26)
        e IPv6 (25) em ordem de endereço, no formato de `special` do `/ip`, e
        as faixas de ASN (9) em ordem numérica, no formato de `special` do
        `/asn`. Inclui as entradas encerradas (`termination_date`
        preenchido). Sem parâmetros de consulta: a lista vem sempre inteira,
        sem paginação nem filtro (a query string é ignorada).
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Os registros de uso especial.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Dataset-Version:
              $ref: '#/components/headers/XDatasetVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialResponse'
              example:
                ipv4:
                  - prefix: 0.0.0.0/8
                    name: '"This network"'
                    rfc: '[RFC791], Section 3.2'
                    allocation_date: '1981-09'
                    termination_date: null
                    source: true
                    destination: false
                    forwardable: false
                    globally_reachable: false
                    reserved_by_protocol: true
                ipv6:
                  - prefix: '::/128'
                    name: Unspecified Address
                    rfc: '[RFC4291]'
                    allocation_date: '2006-02'
                    termination_date: null
                    source: true
                    destination: false
                    forwardable: false
                    globally_reachable: false
                    reserved_by_protocol: true
                asn:
                  - start: 0
                    end: 0
                    reason: Reserved by [RFC7607]
                    reference: '[RFC7607]'
                dataset:
                  version: 01a0eaa2-fd5c-7c24-bc6c-4e3c35d61c53
                  updated_at: '2026-09-29T00:49:05Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatasetUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /rdap:
    get:
      operationId: getRDAP
      tags: [dados]
      summary: Bootstrap RDAP
      description: |
        O bootstrap RDAP (RFC 9224) inteiro (~41 KB): as entradas de
        `asn.json` (159, em ordem de faixa), `ipv4.json` (221) e `ipv6.json`
        (34) (em ordem de endereço), no formato de `rdap` do `/asn` e do
        `/ip`, e o campo `publication` de cada JSON (`null` se o arquivo não
        trouxer). Sem parâmetros de consulta: a lista vem sempre inteira, sem
        paginação nem filtro (a query string é ignorada).
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: O bootstrap RDAP.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Dataset-Version:
              $ref: '#/components/headers/XDatasetVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RDAPResponse'
              example:
                publication:
                  asn: '2026-06-01T20:00:01Z'
                  ipv4: '2019-06-07T19:00:02Z'
                  ipv6: '2024-11-01T22:00:01Z'
                asn:
                  - resource: 1-1876
                    registry: arin
                    urls:
                      - https://rdap.arin.net/registry/
                      - http://rdap.arin.net/registry/
                ipv4:
                  - resource: 1.0.0.0/8
                    registry: apnic
                    urls: [https://rdap.apnic.net/]
                ipv6:
                  - resource: 2001:200::/23
                    registry: apnic
                    urls: [https://rdap.apnic.net/]
                dataset:
                  version: 01a0eaa2-fd5c-7c24-bc6c-4e3c35d61c53
                  updated_at: '2026-09-29T00:49:05Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/InternalError'
