components:
  parameters:
    ASN:
      name: asn
      in: path
      required: true
      description: Número do AS, de 0 a 4294967295, com ou sem o prefixo `AS` (maiúsculas ou minúsculas).
      schema:
        type: string
        pattern: '^([Aa][Ss])?[0-9]+$'
      example: AS61613
    IP:
      name: ip
      in: path
      required: true
      description: |
        Endereço IPv4 ou IPv6. IPv4 mapeado em IPv6 (`::ffff:10.0.0.1`) vira
        IPv4; endereço com zona (`fe80::1%eth0`) é inválido.
      schema:
        type: string
        anyOf:
          - format: ipv4
          - format: ipv6
      example: 192.0.0.9
    PrefixAddress:
      name: ip
      in: path
      required: true
      description: |
        Endereço do prefixo, IPv4 ou IPv6 (as mesmas regras do `/ip`). Os bits
        de host são zerados.
      schema:
        type: string
        anyOf:
          - format: ipv4
          - format: ipv6
      example: '2001:db8::'
    PrefixLength:
      name: len
      in: path
      required: true
      description: Tamanho do prefixo, de 0 a 32 (IPv4) ou a 128 (IPv6).
      schema:
        type: integer
        minimum: 0
        maximum: 128
      example: 48
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |
        ETag de uma resposta anterior (fraco ou forte, numa lista, ou `*`). Se
        bater com o ETag atual, a resposta é `304` sem corpo e sem consultar
        nada.
      schema:
        type: string
      example: W/"3db9c99d25843e9a"
  headers:
    ETag:
      description: |
        ETag fraco, `W/"<hash da versão do dataset + consulta normalizada>"`.
        O mesmo com e sem `/v1`; muda quando a versão dos dados muda.
      schema:
        type: string
      example: W/"3db9c99d25843e9a"
    CacheControlPublic:
      description: Cacheável por 5 minutos.
      schema:
        type: string
        const: public, max-age=300
      example: public, max-age=300
    CacheControlNoStore:
      description: Não cacheável.
      schema:
        type: string
        const: no-store
      example: no-store
    XCache:
      description: |
        `HIT` (veio do Valkey, ou `304`), `MISS` (consultou o Postgres e
        guardou no Valkey) ou `BYPASS` (cache desligado).
      schema:
        type: string
        enum: [HIT, MISS, BYPASS]
      example: MISS
    XDatasetVersion:
      description: Versão dos dados usada na resposta (a mesma de `dataset.version`).
      schema:
        type: string
        format: uuid
      example: 01a0eaa2-fd5c-7c24-bc6c-4e3c35d61c53
  responses:
    NotModified:
      description: |
        O `If-None-Match` bateu com o ETag atual: sem corpo e sem consulta ao
        banco (`X-Cache: HIT`).
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControlPublic'
        X-Cache:
          $ref: '#/components/headers/XCache'
        X-Dataset-Version:
          $ref: '#/components/headers/XDatasetVersion'
    BadRequest:
      description: ASN, IP ou tamanho de prefixo inválido (`bad_request`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            asn:
              summary: ASN inválido
              value:
                error:
                  code: bad_request
                  message: 'ASN inválido: use um número de 0 a 4294967295, com ou sem o prefixo AS'
            ip:
              summary: IP inválido
              value:
                error:
                  code: bad_request
                  message: endereço IP inválido
            len:
              summary: Tamanho de prefixo inválido
              value:
                error:
                  code: bad_request
                  message: tamanho de prefixo inválido
    NotFound:
      description: |
        Rota inexistente (`not_found`): qualquer caminho ou método fora dos
        descritos aqui. As rotas de consulta não respondem 404 para entrada
        válida.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: rota inexistente; veja /iana/
    DatasetUnavailable:
      description: |
        `dataset_not_ready` (a primeira sincronização do collector-iana ainda
        não terminou) ou `database_unavailable` (falha no Postgres).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            dataset_not_ready:
              summary: Antes da primeira carga
              value:
                error:
                  code: dataset_not_ready
                  message: a primeira sincronização do collector-iana ainda não terminou; tente em alguns minutos
            database_unavailable:
              summary: Falha no Postgres
              value:
                error:
                  code: database_unavailable
                  message: banco de dados indisponível
    DatabaseUnavailable:
      description: Falha no Postgres (`database_unavailable`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: database_unavailable
              message: banco de dados indisponível
    Timeout:
      description: A consulta passou de `DB_TIMEOUT` (`timeout`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: timeout
              message: a consulta demorou demais
    InternalError:
      description: Panic no tratamento da requisição, registrado no log (`internal_error`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: erro interno
    StatusOK:
      description: |
        A API responde: `ok` (tudo no ar), `starting` (ainda não há dados) ou
        `degraded` (Valkey fora; a API segue sem cache).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
          example:
            success: true
            status: ok
            timestamp: '2026-09-29T01:00:00Z'
            message: api-iana operacional
            checks:
              dataset: ok
              postgres: ok
              valkey: ok
    StatusUnavailable:
      description: Postgres fora (`status` `error`, `success` `false`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
          example:
            success: false
            status: error
            timestamp: '2026-09-29T01:00:00Z'
            message: PostgreSQL indisponível
            checks:
              dataset: ok
              postgres: error
              valkey: ok
  schemas:
    Registry:
      description: |
        RIR responsável: `afrinic`, `apnic`, `arin`, `lacnic`, `ripencc`, ou
        `null` (sem RIR: reservado, IANA, 6to4...; no RDAP, servidor de outro
        operador).
      type: [string, 'null']
      enum: [afrinic, apnic, arin, lacnic, ripencc, null]
    IANADate:
      description: |
        Data como a IANA publica, em texto: `AAAA-MM` ou `AAAA-MM-DD`; `null`
        quando vazia.
      type: [string, 'null']
      pattern: '^[0-9]{4}-[0-9]{2}(-[0-9]{2})?$'
    Dataset:
      type: object
      description: Versão dos dados usada na resposta.
      required: [version, updated_at]
      properties:
        version:
          type: string
          format: uuid
          description: |
            UUID da última carga aplicada pelo collector-iana
            (`iana_run.uuid`); entra na chave de cache e no ETag.
        updated_at:
          type: string
          format: date-time
          description: Quando o collector-iana aplicou essa carga (UTC).
    ASNBlock:
      type: object
      description: Faixa de ASN de `as-numbers-1`/`-2`.
      required: [start, end, description, registry, whois, rdap_urls, reference, registration_date]
      properties:
        start:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Primeiro ASN da faixa.
        end:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Último ASN da faixa, inclusive.
        description:
          type: string
          description: Coluna Description como publicada (ex. `Assigned by LACNIC`, `Reserved`).
        registry:
          $ref: '#/components/schemas/Registry'
        whois:
          type: [string, 'null']
          description: Servidor WHOIS da faixa; `null` quando vazio.
        rdap_urls:
          type: array
          description: URLs RDAP da faixa (`[]` se nenhuma).
          items:
            type: string
            format: uri
        reference:
          type: [string, 'null']
          description: Coluna Reference como publicada (ex. `[RFC7607]`); `null` quando vazia.
        registration_date:
          $ref: '#/components/schemas/IANADate'
    SpecialASN:
      type: object
      description: Faixa de ASN de `special-purpose-as-numbers`.
      required: [start, end, reason, reference]
      properties:
        start:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Primeiro ASN da faixa.
        end:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Último ASN da faixa, inclusive.
        reason:
          type: string
          description: Coluna Reason for Reservation como publicada.
        reference:
          type: [string, 'null']
          description: Coluna Reference como publicada; `null` quando vazia.
    PrefixBlock:
      type: object
      description: Bloco de `ipv4-address-space` (/8) ou `ipv6-unicast-address-assignments`.
      required: [prefix, designation, registry, status, whois, rdap_urls, allocation_date, note]
      properties:
        prefix:
          type: string
          description: Bloco em notação CIDR (ex. `192.0.0.0/8`, `2001:c00::/23`).
        designation:
          type: string
          description: Coluna Designation como publicada (ex. `Administered by ARIN`, `APNIC`).
        registry:
          $ref: '#/components/schemas/Registry'
        status:
          type: string
          description: Coluna Status em maiúsculas; hoje `ALLOCATED`, `LEGACY` ou `RESERVED`.
          examples: [ALLOCATED, LEGACY, RESERVED]
        whois:
          type: [string, 'null']
          description: Servidor WHOIS do bloco; `null` quando vazio.
        rdap_urls:
          type: array
          description: URLs RDAP do bloco (`[]` se nenhuma).
          items:
            type: string
            format: uri
        allocation_date:
          $ref: '#/components/schemas/IANADate'
        note:
          type: [string, 'null']
          description: |
            Notas da IANA; no IPv4 só as marcas de nota de rodapé (ex.
            `[10][11]`). `null` quando vazio.
    SpecialPrefix:
      type: object
      description: |
        Bloco de um special-purpose registry (IPv4 ou IPv6). As 5 flags saem
        `null` quando a IANA publica vazio ou `N/A`.
      required: [prefix, name, rfc, allocation_date, termination_date, source, destination, forwardable, globally_reachable, reserved_by_protocol]
      properties:
        prefix:
          type: string
          description: Bloco em notação CIDR.
        name:
          type: string
          description: Coluna Name como publicada.
        rfc:
          type: [string, 'null']
          description: Coluna RFC como publicada; `null` quando vazia.
        allocation_date:
          $ref: '#/components/schemas/IANADate'
        termination_date:
          $ref: '#/components/schemas/IANADate'
          description: Data de encerramento; preenchida = entrada encerrada, que não conta na regra de bogon.
        source:
          type: [boolean, 'null']
          description: Válido como endereço de origem.
        destination:
          type: [boolean, 'null']
          description: Válido como endereço de destino.
        forwardable:
          type: [boolean, 'null']
          description: Roteadores podem encaminhar.
        globally_reachable:
          type: [boolean, 'null']
          description: |
            Alcançável na Internet pública. Decide a regra de bogon quando é a
            entrada em vigor mais específica (`false` = bogon, `true` = não
            bogon, `null` = passa para a regra da alocação da IANA).
        reserved_by_protocol:
          type: [boolean, 'null']
          description: Reservado pelo protocolo.
    RDAPService:
      type: object
      description: Entrada do bootstrap RDAP (`asn.json`, `ipv4.json` ou `ipv6.json`).
      required: [resource, registry, urls]
      properties:
        resource:
          type: string
          description: Faixa de ASN (`61440-61951`, ou um número só) ou bloco CIDR (`192.0.0.0/8`).
        registry:
          $ref: '#/components/schemas/Registry'
        urls:
          type: array
          description: URLs base do servidor RDAP, na ordem publicada.
          items:
            type: string
            format: uri
    ASNResponse:
      type: object
      required: [asn, block, special, rdap, dataset]
      properties:
        asn:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: ASN consultado, normalizado.
        block:
          description: Faixa que contém o ASN (`null` só com dados incompletos).
          oneOf:
            - $ref: '#/components/schemas/ASNBlock'
            - type: 'null'
        special:
          type: array
          description: Faixas de uso especial que contêm o ASN, em ordem de início (`[]` se nenhuma).
          items:
            $ref: '#/components/schemas/SpecialASN'
        rdap:
          description: Entrada do bootstrap RDAP que contém o ASN, ou `null`.
          oneOf:
            - $ref: '#/components/schemas/RDAPService'
            - type: 'null'
        dataset:
          $ref: '#/components/schemas/Dataset'
    IPResponse:
      type: object
      required: [ip, block, special, bogon, rdap, dataset]
      properties:
        ip:
          type: string
          anyOf:
            - format: ipv4
            - format: ipv6
          description: IP consultado, normalizado (IPv4 mapeado em IPv6 vira IPv4).
        block:
          description: Bloco mais específico da IANA que contém o IP, ou `null`.
          oneOf:
            - $ref: '#/components/schemas/PrefixBlock'
            - type: 'null'
        special:
          type: array
          description: |
            Todas as entradas de uso especial que contêm o IP, da mais
            específica para a menos, inclusive as encerradas (`[]` se nenhuma).
          items:
            $ref: '#/components/schemas/SpecialPrefix'
        bogon:
          type: boolean
          description: Resultado da regra de bogon (veja a descrição da operação).
        rdap:
          description: Entrada mais específica do bootstrap RDAP que contém o IP, ou `null`.
          oneOf:
            - $ref: '#/components/schemas/RDAPService'
            - type: 'null'
        dataset:
          $ref: '#/components/schemas/Dataset'
    PrefixResponse:
      type: object
      required: [query, block, special, bogon, rdap, dataset]
      properties:
        query:
          type: string
          description: Prefixo consultado em notação CIDR, com os bits de host zerados.
        block:
          description: Bloco mais específico da IANA que contém o prefixo, ou `null`.
          oneOf:
            - $ref: '#/components/schemas/PrefixBlock'
            - type: 'null'
        special:
          type: array
          description: |
            Entradas de uso especial que contêm o prefixo, da mais específica
            para a menos (as que estão dentro dele não entram).
          items:
            $ref: '#/components/schemas/SpecialPrefix'
        bogon:
          type: boolean
          description: Resultado da regra de bogon aplicada ao prefixo inteiro.
        rdap:
          description: Entrada mais específica do bootstrap RDAP que contém o prefixo, ou `null`.
          oneOf:
            - $ref: '#/components/schemas/RDAPService'
            - type: 'null'
        dataset:
          $ref: '#/components/schemas/Dataset'
    ASNBlocksResponse:
      type: object
      required: [count, blocks, dataset]
      properties:
        count:
          type: integer
          description: Número de faixas em `blocks`.
        blocks:
          type: array
          description: Todas as faixas de ASN, em ordem numérica.
          items:
            $ref: '#/components/schemas/ASNBlock'
        dataset:
          $ref: '#/components/schemas/Dataset'
    PrefixBlocksResponse:
      type: object
      required: [count, blocks, dataset]
      properties:
        count:
          type: integer
          description: Número de blocos em `blocks`.
        blocks:
          type: array
          description: Todos os blocos da família, em ordem de endereço.
          items:
            $ref: '#/components/schemas/PrefixBlock'
        dataset:
          $ref: '#/components/schemas/Dataset'
    SpecialResponse:
      type: object
      required: [ipv4, ipv6, asn, dataset]
      properties:
        ipv4:
          type: array
          description: Blocos IPv4 de uso especial, em ordem de endereço.
          items:
            $ref: '#/components/schemas/SpecialPrefix'
        ipv6:
          type: array
          description: Blocos IPv6 de uso especial, em ordem de endereço.
          items:
            $ref: '#/components/schemas/SpecialPrefix'
        asn:
          type: array
          description: Faixas de ASN de uso especial, em ordem numérica.
          items:
            $ref: '#/components/schemas/SpecialASN'
        dataset:
          $ref: '#/components/schemas/Dataset'
    RDAPPublication:
      type: object
      description: Campo `publication` de cada JSON do bootstrap RDAP, como publicado.
      required: [asn, ipv4, ipv6]
      properties:
        asn:
          type: [string, 'null']
          format: date-time
          description: '`publication` de `asn.json`; `null` se o arquivo não trouxer.'
        ipv4:
          type: [string, 'null']
          format: date-time
          description: '`publication` de `ipv4.json`; `null` se o arquivo não trouxer.'
        ipv6:
          type: [string, 'null']
          format: date-time
          description: '`publication` de `ipv6.json`; `null` se o arquivo não trouxer.'
    RDAPResponse:
      type: object
      required: [publication, asn, ipv4, ipv6, dataset]
      properties:
        publication:
          $ref: '#/components/schemas/RDAPPublication'
        asn:
          type: array
          description: Entradas de `asn.json`, em ordem de faixa.
          items:
            $ref: '#/components/schemas/RDAPService'
        ipv4:
          type: array
          description: Entradas de `ipv4.json`, em ordem de endereço.
          items:
            $ref: '#/components/schemas/RDAPService'
        ipv6:
          type: array
          description: Entradas de `ipv6.json`, em ordem de endereço.
          items:
            $ref: '#/components/schemas/RDAPService'
        dataset:
          $ref: '#/components/schemas/Dataset'
    MetaResponse:
      type: object
      required: [app, version, dataset, collector]
      properties:
        app:
          type: string
          const: api-iana
          description: Nome do app.
        version:
          type: string
          description: Versão do build da API (`dev` fora de um build com tag).
        dataset:
          description: Último dataset aplicado, ou `null` antes da primeira carga.
          oneOf:
            - $ref: '#/components/schemas/MetaDataset'
            - type: 'null'
        collector:
          description: Linha do `collector-iana` em `jobs`, ou `null` se ainda não existe.
          oneOf:
            - $ref: '#/components/schemas/MetaCollector'
            - type: 'null'
    MetaDataset:
      type: object
      description: Último dataset aplicado pelo collector-iana (`iana_run` com `status = 1`).
      required: [version, updated_at, sha256, files]
      properties:
        version:
          type: string
          format: uuid
          description: Versão dos dados (`iana_run.uuid`).
        updated_at:
          type: string
          format: date-time
          description: Quando a carga foi aplicada (UTC).
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Hash combinado dos 10 arquivos.
        files:
          type: array
          description: Os 10 arquivos da IANA, na ordem fixa do collector-iana.
          items:
            $ref: '#/components/schemas/MetaFile'
    MetaFile:
      type: object
      description: Um dos arquivos da IANA do dataset aplicado.
      required: [name, url, sha256, bytes, rows, last_modified, publication]
      properties:
        name:
          type: string
          description: |
            Nome do arquivo no collector-iana: `as-numbers-1`, `as-numbers-2`,
            `ipv4-address-space`, `ipv6-unicast-address-assignments`,
            `iana-ipv4-special-registry-1`, `iana-ipv6-special-registry-1`,
            `special-purpose-as-numbers`, `rdap-asn`, `rdap-ipv4` ou
            `rdap-ipv6`.
        url:
          type: string
          format: uri
          description: URL de onde o arquivo foi baixado.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 do conteúdo.
        bytes:
          type: integer
          format: int64
          description: Tamanho em bytes.
        rows:
          type: [integer, 'null']
          description: Linhas lidas pelo parser; `null` quando o collector não gravou.
        last_modified:
          type: [string, 'null']
          description: Cabeçalho `Last-Modified` da IANA (data HTTP); `null` quando ausente.
        publication:
          type: [string, 'null']
          format: date-time
          description: Campo `publication` do JSON (só nos `rdap-*`); `null` nos demais ou quando ausente.
    MetaCollector:
      type: object
      description: Linha do `collector-iana` na tabela `jobs`.
      required: [app, last_sync_at, last_check_at, consolidated]
      properties:
        app:
          type: string
          const: collector-iana
          description: Nome do coletor.
        last_sync_at:
          type: [string, 'null']
          format: date-time
          description: Última sincronização realizada (UTC).
        last_check_at:
          type: [string, 'null']
          format: date-time
          description: Última verificação dos arquivos na IANA (UTC).
        consolidated:
          type: boolean
          description: Se a consolidação da fase 2 já copiou a carga atual (`jobs.consolidated = 1`).
    Status:
      type: object
      description: Resposta de `/health` e `/status`.
      required: [success, status, timestamp, message, checks]
      properties:
        success:
          type: boolean
          description: '`false` só com `status` `error`.'
        status:
          type: string
          enum: [ok, starting, degraded, error]
          description: |
            `ok` (tudo no ar), `starting` (sem dados ainda), `degraded` (Valkey
            fora) ou `error` (Postgres fora, HTTP 503).
        timestamp:
          type: string
          format: date-time
          description: Hora da verificação (UTC).
        message:
          type: string
          description: Mensagem em PT-BR sobre o estado.
        checks:
          $ref: '#/components/schemas/StatusChecks'
    StatusChecks:
      type: object
      description: Resultado de cada verificação.
      required: [postgres, valkey, dataset]
      properties:
        postgres:
          type: string
          enum: [ok, error]
          description: Ping no Postgres.
        valkey:
          type: string
          enum: [ok, error, disabled]
          description: Ping no Valkey (`disabled` com o cache desligado).
        dataset:
          type: string
          enum: [ok, empty]
          description: '`empty` antes da primeira carga do collector-iana.'
    IndexResponse:
      type: object
      required: [app, version, base_path, versions, endpoints, source]
      properties:
        app:
          type: string
          const: api-iana
          description: Nome do app.
        version:
          type: string
          description: Versão do build da API.
        base_path:
          type: string
          description: Caminho de base (`BASE_PATH`).
        versions:
          type: array
          description: Versões da API servidas (a última é a das rotas sem versão).
          items:
            type: string
        endpoints:
          type: array
          description: Rotas principais, com o caminho de base.
          items:
            type: string
        source:
          type: string
          format: uri
          description: Página da IANA com os registros de numeração.
    Error:
      type: object
      description: Corpo de toda resposta de erro.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, not_found, dataset_not_ready, database_unavailable, timeout, internal_error]
              description: Código do erro, estável para uso em programas.
            message:
              type: string
              description: Mensagem em PT-BR para pessoas.
