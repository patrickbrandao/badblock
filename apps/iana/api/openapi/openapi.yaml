    get:
      operationId: getHealth
      tags: [saúde]
      summary: Saúde da API
      description: |
        Mesmo conteúdo de `/status`: confere o Postgres, o Valkey e se já há
        dados. Postgres fora = `error` (503); só o Valkey fora = `degraded`
        (200, a API segue sem cache); sem dados ainda = `starting` (200).
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StatusUnavailable'
    post:
      operationId: postHealth
      tags: [saúde]
      summary: Saúde da API (POST)
