openapi: 3.1.0
info:
  title: api-anatel-pst
  version: '0.1.0'
  summary: Prestadoras de serviços de telecomunicações da Anatel em JSON — CNPJ, serviços notificados (SCM, STFC, SMP, SeAC…), outorgas e Fistel.
  description: |-
    API HTTP (JSON), só de leitura, com o cadastro de **prestadoras de
    serviços de telecomunicações** da Anatel, a partir do arquivo
    [`prestadoras_servicos_telecomunicacoes.zip`](https://www.anatel.gov.br/dadosabertos/paineis_de_dados/outorga_e_licenciamento/prestadoras_servicos_telecomunicacoes.zip)
    (~45 mil CNPJs, ~54 mil serviços notificados, 55 códigos de serviço),
    que o `collector-anatel-pst` grava nas tabelas `anatel_pst_*`. Responde
    "este CNPJ é uma prestadora autorizada? de quê?" — por exemplo, se tem
    SCM (código 045, a licença de provedor de internet). Só pessoas
    jurídicas: as linhas de pessoa física (CPF) da fonte não são guardadas.
    Pública, sem chave; rate limit por IP no proxy.

    - Textos como a Anatel publica (razão social, nomes de serviço em
      maiúsculas ou não); ausentes na fonte (`N/I`, `N/A`, `-`, vazio) saem
      `null`. Datas `AAAA-MM-DD`; timestamps em UTC.
    - `first_seen` e `updated_at` de uma prestadora são datas **deste
      banco** (primeira vez que o CNPJ apareceu desde a primeira carga), não
      datas da Anatel.
    - Versões são servidores: as rotas de dados respondem no servidor sem
      versão (versão atual, hoje v1) e no servidor `/v1` (v1 fixa), com o
      mesmo conteúdo, o mesmo ETag e a mesma chave de cache. Saúde
      (`/health`, `/status`, `/ping`) e `/openapi.yaml` ficam fora do
      versionamento: só existem no servidor sem versão (declaram `servers`
      próprios).
    - Toda rota com `GET` também aceita `HEAD`; `OPTIONS` responde o preflight
      de CORS (204, `GET, HEAD, OPTIONS`). `/anatel/pst` redireciona (301)
      para `/anatel/pst/`; qualquer outro caminho (ou método) responde 404 em
      JSON.
    - Todas as respostas levam `X-Content-Type-Options: nosniff`,
      `Referrer-Policy: no-referrer`, `Access-Control-Allow-Origin`,
      `Access-Control-Expose-Headers: ETag, X-Cache, X-Dataset-Version` e
      `Server: badblock-api-anatel-pst/<versão>`.
    - Erros sempre em JSON `{"error": {"code", "message"}}`, com
      `Cache-Control: no-store`. A validação vem antes de tudo: um pedido
      inválido recebe 400 mesmo antes da primeira carga dos dados.
  license:
    name: MIT
    identifier: MIT
externalDocs:
  description: Especificações da fonte (fonte da verdade)
  url: https://github.com/patrickbrandao/badblock/tree/main/specs/fontes/anatel/pst
servers:
  - url: https://api.badblock.net.br/anatel/pst
    description: Produção, versão atual (hoje v1)
  - url: https://api.badblock.net.br/anatel/pst/v1
    description: Produção, v1 fixa
  - url: http://127.0.0.1:8112/anatel/pst
    description: Desenvolvimento local, versão atual (porta publicada no loopback pelo docker-compose.yml)
  - url: http://127.0.0.1:8112/anatel/pst/v1
    description: Desenvolvimento local, v1 fixa
tags:
  - name: dados
    description: Consultas às prestadoras e aos serviços (com ETag e cache no Valkey).
  - name: meta
    description: Índice, estado dos dados e este manifesto.
  - name: saúde
    description: Saúde do serviço, fora do versionamento.
paths:
  /:
    get:
      operationId: getIndex
      tags: [meta]
      summary: Índice da API
      description: |-
        App, versão do build, caminho de base, versões da API e rotas.
        Responde igual nos dois servidores (`/anatel/pst/` e
        `/anatel/pst/v1/`); não consulta o banco nem o Valkey.
      responses:
        '200':
          description: O índice.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
              example:
                app: api-anatel-pst
                version: '0.1.0'
                base_path: /anatel/pst
                versions: [v1]
                endpoints:
                  - /anatel/pst/provider/{cnpj}
                  - /anatel/pst/services
                  - /anatel/pst/service/{code}
                  - /anatel/pst/search?q={texto}
                  - /anatel/pst/meta
                  - /anatel/pst/status
                  - /anatel/pst/openapi.yaml
                source: https://www.anatel.gov.br/dadosabertos/paineis_de_dados/outorga_e_licenciamento/prestadoras_servicos_telecomunicacoes.zip
        '500':
          $ref: '#/components/responses/InternalError'
  /provider/{cnpj}:
    get:
      operationId: getProvider
      tags: [dados]
      summary: Uma prestadora pelo CNPJ, com todos os serviços
      description: |-
        A prestadora de um CNPJ — razão social, nome fantasia, endereço da
        sede, telefone e e-mail — e todos os serviços que ela notificou à
        Anatel, cada um com a outorga (tipo, Fistel, processo e data), em
        ordem de código, data da notificação e Fistel da notificação. O
        mesmo código pode aparecer várias vezes (Fistéis de notificação
        diferentes, ou a mesma notificação sob duas outorgas);
        `service_codes` traz os códigos distintos, em ordem. Até 72 serviços
        e ~29 KB por prestadora no arquivo de 2026-09-30.
      parameters:
        - $ref: '#/components/parameters/CNPJ'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A prestadora e os seus serviços.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Dataset-Version:
              $ref: '#/components/headers/XDatasetVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderResponse'
              examples:
                telefonica:
                  summary: GET /anatel/pst/provider/02558157000162 (trecho — 3 dos 42 serviços da resposta real)
                  value:
