                    app: api-anatel-pst
                    version: '0.1.0'
                    dataset: null
                    collector: null
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /health:
    servers:
      - url: https://api.badblock.net.br/anatel/pst
        description: Produção
      - url: http://127.0.0.1:8112/anatel/pst
        description: Desenvolvimento local
    get:
      operationId: getHealth
      tags: [saúde]
      summary: Saúde do serviço
      description: |-
        Mesmo conteúdo de `/status`. Confere o PostgreSQL, o Valkey e se já
        há dados carregados; nunca usa o cache.
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StatusError'
    post:
      operationId: postHealth
      tags: [saúde]
      summary: Saúde do serviço (POST)
      description: Igual ao `GET /health`; o corpo do pedido é ignorado.
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StatusError'
  /status:
    servers:
      - url: https://api.badblock.net.br/anatel/pst
        description: Produção
      - url: http://127.0.0.1:8112/anatel/pst
        description: Desenvolvimento local
    get:
      operationId: getStatus
      tags: [saúde]
      summary: Estado do serviço
      description: |-
        Precedência `error` > `degraded` > `starting` > `ok`: `error` (HTTP
        503, `success: false`) com o PostgreSQL fora; `degraded` com o Valkey
        fora (a API segue sem cache); `starting` antes da primeira carga do
        collector; `ok` com tudo no ar.
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StatusError'
    post:
      operationId: postStatus
      tags: [saúde]
      summary: Estado do serviço (POST)
      description: Igual ao `GET /status`; o corpo do pedido é ignorado.
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StatusError'
  /ping:
    servers:
      - url: https://api.badblock.net.br/anatel/pst
        description: Produção
      - url: http://127.0.0.1:8112/anatel/pst
        description: Desenvolvimento local
    get:
      operationId: ping
      tags: [saúde]
      summary: pong
      description: |-
        Responde o texto `pong` sem consultar nada. É o healthcheck do Docker
        (a cada 15 s) e fica fora do log de acesso.
      responses:
        '200':
          description: O texto `pong`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            text/plain:
              schema:
                type: string
                const: pong
              example: pong
  /openapi.yaml:
    servers:
      - url: https://api.badblock.net.br/anatel/pst
        description: Produção
      - url: http://127.0.0.1:8112/anatel/pst
        description: Desenvolvimento local
    get:
      operationId: getOpenAPI
      tags: [meta]
      summary: Este manifesto OpenAPI
      description: |-
        O contrato da API em OpenAPI 3.1, embutido no binário (mesmo conteúdo
        de `openapi/openapi.yaml` no repositório). Não usa o Valkey.
      responses:
        '200':
          description: O manifesto em YAML.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
          content:
            application/yaml:
              schema:
                type: string
components:
  parameters:
    CNPJ:
      name: cnpj
      in: path
      required: true
      description: |-
        CNPJ da prestadora. Todo caractere que não é dígito ASCII é
        descartado e precisam sobrar exatamente 14 dígitos; senão, 400. Vale
        só dígitos (`02558157000162`) ou formatado com a barra codificada
        (`02.558.157%2F0001-62`): a barra sem codificar abre outro segmento
        do caminho e cai no 404 de rota inexistente. Os dígitos
        verificadores não são conferidos.
      schema:
        type: string
        minLength: 14
      examples:
        digitos:
          value: '02558157000162'
        formatado:
          value: 02.558.157%2F0001-62
    ServiceCode:
      name: code
      in: path
      required: true
      description: |-
        Código do serviço na Anatel: de 1 a 3 dígitos ASCII, completados com
        zeros à esquerda (`45` = `045`, o SCM). Outra coisa (4 dígitos,
        letra, sinal): 400.
      schema:
        type: string
        pattern: '^[0-9]{1,3}$'
      examples:
        scm:
          value: '045'
        sem_zero:
          value: '45'
    State:
      name: state
      in: query
      required: false
      description: |-
        Filtro opcional pela UF da sede: duas letras ASCII em qualquer caixa
        (`sp` = `SP`). Ausente ou vazio: sem filtro. Outra coisa: 400.
        Qualquer par de letras passa na validação; um que não é UF responde
        a lista vazia.
      schema:
        type: string
        pattern: '^[A-Za-z]{2}$'
      example: SP
    SearchQuery:
      name: q
      in: query
      required: true
      description: |-
        Trecho da razão social ou do nome fantasia. Vale o primeiro, se
        repetido. Espaços das pontas saem e os internos (inclusive tab e
        quebra de linha) viram um só; passa a minúsculas; precisa ter de 3 a
        100 caracteres (não bytes), UTF-8 válido e nenhum caractere de
        controle. `%`, `_` e `\` são procurados como texto.
      schema:
        type: string
        minLength: 3
        maxLength: 100
      example: telefonica
    SearchLimit:
      name: limit
      in: query
      required: false
      description: |-
        Máximo de itens, de 1 a 100 (padrão 100), só dígitos ASCII; ausente
        ou vazio vale 100. Outro valor (0, 101, sinal, letra): 400.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
      example: 10
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |-
        ETag de uma resposta anterior (fraco ou forte, vários separados por
        vírgula, ou `*`). Se algum bater com o ETag atual, a resposta é 304
        sem corpo e sem consultar nada.
      schema:
        type: string
      example: 'W/"7b5f3c4da8ce91e8"'
  headers:
    ETag:
      description: |-
        ETag fraco, `W/"<FNV-1a de 64 bits da versão do dataset + consulta
        normalizada>"` (ex.: o de `/anatel/pst/provider/02558157000162` na
        versão dos exemplos). Igual com e sem `/v1` e muda quando a versão
        dos dados muda.
      schema:
        type: string
      example: 'W/"7b5f3c4da8ce91e8"'
    CacheControlPublic:
      description: Cache por 5 minutos em clientes e proxies.
      schema:
        type: string
        const: public, max-age=300
    CacheControlNoStore:
      description: Não guardar em cache.
      schema:
        type: string
        const: no-store
    XCache:
      description: |-
        `HIT` (veio do Valkey, ou 304), `MISS` (consultou o PostgreSQL) ou
        `BYPASS` (cache desligado).
      schema:
        type: string
        enum: [HIT, MISS, BYPASS]
    XDatasetVersion:
      description: Versão dos dados usada na resposta (uuid da última execução aplicada).
      schema:
        type: string
        format: uuid
      example: 01a0f518-b4d2-7810-80b5-b58a6c2e4614
  responses:
    NotModified:
      description: |-
        O `If-None-Match` bate com o ETag atual: sem corpo e sem consultar o
        banco nem o Valkey.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControlPublic'
        X-Cache:
          $ref: '#/components/headers/XCache'
        X-Dataset-Version:
          $ref: '#/components/headers/XDatasetVersion'
    BadRequest:
      description: Parâmetro inválido (`bad_request`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            cnpj:
              summary: CNPJ sem 14 dígitos (/provider/123)
              value:
                error:
                  code: bad_request
                  message: 'CNPJ inválido: use os 14 dígitos, com ou sem pontuação (ex.: 02558157000162 ou 02.558.157%2F0001-62)'
            code:
              summary: Código de serviço inválido (/service/abcd)
              value:
                error:
                  code: bad_request
                  message: 'código de serviço inválido: use de 1 a 3 dígitos (ex.: 045 ou 45 para o SCM)'
            state:
              summary: UF inválida (/service/045?state=SPA)
              value:
                error:
                  code: bad_request
                  message: 'UF inválida: use a sigla de duas letras (ex.: ?state=SP)'
            q:
              summary: Termo de busca curto, longo ou ausente (/search?q=ab)
              value:
                error:
                  code: bad_request
                  message: 'use o parâmetro q com um trecho de 3 a 100 caracteres, sem caracteres de controle (ex.: ?q=telefonica)'
            limit:
              summary: limit fora de 1 a 100 (/search?q=abc&limit=500)
              value:
                error:
                  code: bad_request
                  message: 'limit inválido: use um número de 1 a 100 (padrão 100)'
    NotFound:
      description: CNPJ ou código de serviço que não está no arquivo (`not_found`); não entra no cache.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            provider:
              summary: CNPJ válido fora do cadastro (/provider/00.000.000%2F0000-00)
              value:
                error:
                  code: not_found
                  message: CNPJ 00000000000000 não consta no cadastro de prestadoras da Anatel
            service:
              summary: Código válido fora do arquivo (/service/999)
              value:
                error:
                  code: not_found
                  message: serviço 999 não consta no cadastro de prestadoras da Anatel
    ServiceUnavailable:
      description: |-
        `dataset_not_ready` antes da primeira carga do collector, ou
        `database_unavailable` quando o PostgreSQL falha.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            dataset_not_ready:
              summary: Antes da primeira carga
              value:
                error:
                  code: dataset_not_ready
                  message: a primeira sincronização do collector-anatel-pst ainda não terminou; tente em alguns minutos
            database_unavailable:
              summary: PostgreSQL fora
              value:
                error:
                  code: database_unavailable
                  message: banco de dados indisponível
    DatabaseUnavailable:
      description: Falha no PostgreSQL (`database_unavailable`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: database_unavailable
              message: banco de dados indisponível
    Timeout:
      description: A consulta passou de `DB_TIMEOUT` (`timeout`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: timeout
              message: a consulta demorou demais
    InternalError:
      description: Panic no servidor, registrado no log (`internal_error`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: erro interno
    StatusOK:
      description: Serviço no ar (`ok`, `starting` ou `degraded`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
          example:
            success: true
            status: ok
            timestamp: '2026-10-01T01:35:50Z'
            message: api-anatel-pst operacional
            checks:
              dataset: ok
              postgres: ok
              valkey: ok
    StatusError:
      description: PostgreSQL fora (`status` = `error`, `success` = false).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
          example:
            success: false
            status: error
            timestamp: '2026-10-01T01:35:50Z'
            message: PostgreSQL indisponível
            checks:
              dataset: ok
              postgres: error
              valkey: ok
  schemas:
    Dataset:
      type: object
      description: Versão dos dados usada na resposta.
      required: [version, updated_at]
      properties:
        version:
          type: string
          format: uuid
          description: uuid da execução aplicada (`anatel_pst_run`); é a versão usada no cache e no ETag.
        updated_at:
          type: string
          format: date-time
          description: Quando o arquivo foi aplicado (UTC).
    ProviderResponse:
      type: object
      description: Uma prestadora e todos os seus serviços (`GET /provider/{cnpj}`).
      required: [document, name, trade_name, address, phone, email, first_seen, updated_at, service_codes, services, dataset]
      properties:
        document:
          type: string
          pattern: '^[0-9]{14}$'
          description: CNPJ, 14 dígitos sem pontuação.
        name:
          type: string
          description: Razão social.
        trade_name:
          type: [string, 'null']
          description: Nome fantasia; `null` quando a fonte não informa.
        address:
          $ref: '#/components/schemas/Address'
        phone:
          type: [string, 'null']
          description: Telefone principal, texto livre como publicado.
        email:
          type: [string, 'null']
          description: E-mail como publicado.
        first_seen:
          type: string
          format: date-time
          description: Primeira vez que o CNPJ apareceu na fonte, desde a primeira carga deste banco (UTC).
        updated_at:
          type: string
          format: date-time
          description: Última mudança dos dados da prestadora neste banco (UTC).
        service_codes:
          type: array
          description: Os códigos de serviço distintos da prestadora, em ordem.
          items:
            type: string
            pattern: '^[0-9]{3}$'
        services:
          type: array
          description: Os serviços notificados, em ordem de código, data da notificação e Fistel da notificação.
          items:
            $ref: '#/components/schemas/Service'
        dataset:
          $ref: '#/components/schemas/Dataset'
    Address:
      type: object
      description: Endereço da sede, como publicado; cada campo `null` quando a fonte não informa.
      required: [street, number, complement, district, postal_code, city_ibge_code, city, state]
      properties:
        street:
          type: [string, 'null']
          description: Logradouro.
        number:
          type: [string, 'null']
          description: Número, como texto (`S/N`, `1740A`).
        complement:
          type: [string, 'null']
          description: Complemento.
        district:
          type: [string, 'null']
          description: Bairro.
        postal_code:
          type: [string, 'null']
          description: CEP, só dígitos, como publicado (alguns com 7 dígitos).
        city_ibge_code:
          type: [integer, 'null']
          minimum: 1000000
          maximum: 9999999
          description: Código IBGE do município (7 dígitos).
        city:
          type: [string, 'null']
          description: Município.
        state:
          type: [string, 'null']
          pattern: '^[A-Z]{2}$'
          description: UF.
    Service:
      type: object
      description: Um serviço notificado pela prestadora, com a outorga.
      required: [service_code, service_name, service_group, notification_fistel, notification_process, notified_on, entity_type, grant_type, grant_fistel, grant_process, granted_on]
      properties:
        service_code:
          type: string
          pattern: '^[0-9]{3}$'
          description: Código do serviço (`045` = SCM, `171` = STFC, `010` = SMP, `750` = SeAC).
        service_name:
          type: string
          description: Nome do serviço, como publicado.
        service_group:
          type: string
          description: Grupo do serviço, como publicado (`Banda Larga Fixa`).
        notification_fistel:
          type: string
          pattern: '^[0-9]{11}$'
          description: Fistel da notificação do serviço.
        notification_process:
          type: [string, 'null']
          description: Processo SEI da notificação.
        notified_on:
          type: [string, 'null']
          format: date
          description: Data de inclusão da notificação.
        entity_type:
          type: string
          description: '`Outorgada` ou `Dispensada de Outorga`.'
        grant_type:
          type: string
          description: Tipo de outorga como publicado (SIC, SIR ou `Dispensada de Outorga`).
        grant_fistel:
          type: [string, 'null']
          pattern: '^[0-9]{11}$'
          description: Fistel da outorga; `null` quando dispensada.
        grant_process:
          type: [string, 'null']
          description: Processo SEI da outorga; `null` quando dispensada.
        granted_on:
          type: [string, 'null']
          format: date
          description: Data de inclusão da outorga; `null` quando dispensada.
    ServicesResponse:
      type: object
      description: O catálogo de serviços (`GET /services`).
      required: [count, services, dataset]
      properties:
        count:
          type: integer
          minimum: 0
          description: Códigos na lista.
        services:
          type: array
          description: Um item por código, em ordem de código.
          items:
            $ref: '#/components/schemas/ServiceSummary'
        dataset:
          $ref: '#/components/schemas/Dataset'
    ServiceSummary:
      type: object
      description: Um código de serviço com as contagens.
      required: [service_code, service_name, service_group, providers, services]
      properties:
        service_code:
          type: string
          pattern: '^[0-9]{3}$'
          description: Código do serviço.
        service_name:
          type: string
          description: Nome do serviço.
        service_group:
          type: string
          description: Grupo do serviço.
        providers:
          type: integer
          minimum: 1
          description: Prestadoras (CNPJs distintos) com o serviço.
        services:
          type: integer
          minimum: 1
          description: Serviços notificados (linhas) com o código.
    ServiceResponse:
      type: object
      description: As prestadoras de um serviço (`GET /service/{code}`).
      required: [service_code, service_name, service_group, state, count, providers, dataset]
      properties:
        service_code:
          type: string
          pattern: '^[0-9]{3}$'
          description: Código consultado, com 3 dígitos.
        service_name:
          type: string
          description: Nome do serviço.
        service_group:
          type: string
          description: Grupo do serviço.
        state:
          type: [string, 'null']
          pattern: '^[A-Z]{2}$'
          description: O filtro de UF, em maiúsculas; `null` sem filtro.
        count:
          type: integer
          minimum: 0
          description: Prestadoras na lista.
        providers:
          type: array
          description: As prestadoras, em ordem de CNPJ; `[]` quando a UF não tem nenhuma.
          items:
            $ref: '#/components/schemas/ProviderBrief'
        dataset:
          $ref: '#/components/schemas/Dataset'
    SearchResponse:
      type: object
      description: Resultado da busca (`GET /search`).
      required: [query, limit, count, truncated, providers, dataset]
      properties:
        query:
          type: string
          description: O termo normalizado (espaços colapsados, minúsculas).
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: O limite usado.
        count:
          type: integer
          minimum: 0
          maximum: 100
          description: Itens devolvidos.
        truncated:
          type: boolean
          description: '`true` quando havia mais que `limit` resultados.'
        providers:
          type: array
          maxItems: 100
          description: As prestadoras encontradas, em ordem de razão social e CNPJ; `[]` sem resultado.
          items:
            $ref: '#/components/schemas/ProviderBrief'
        dataset:
          $ref: '#/components/schemas/Dataset'
    ProviderBrief:
      type: object
      description: Uma prestadora numa lista.
      required: [document, name, trade_name, city, state]
      properties:
        document:
          type: string
          pattern: '^[0-9]{14}$'
          description: CNPJ.
        name:
          type: string
          description: Razão social.
        trade_name:
          type: [string, 'null']
          description: Nome fantasia.
        city:
          type: [string, 'null']
          description: Município da sede.
        state:
          type: [string, 'null']
          pattern: '^[A-Z]{2}$'
          description: UF da sede.
    MetaResponse:
      type: object
      description: Estado dos dados (`GET /meta`).
      required: [app, version, dataset, collector]
      properties:
        app:
          type: string
          const: api-anatel-pst
          description: Nome do app.
        version:
          type: string
          description: Versão do build da API.
        dataset:
          description: Última execução aplicada; `null` antes da primeira carga.
          oneOf:
            - $ref: '#/components/schemas/MetaDataset'
            - type: 'null'
        collector:
          description: Linha do collector-anatel-pst em `jobs`; `null` antes da primeira execução.
          oneOf:
            - $ref: '#/components/schemas/Collector'
            - type: 'null'
    MetaDataset:
      type: object
      description: O arquivo aplicado por último (linha de `anatel_pst_run`).
      required: [version, updated_at, source, sha256, csv_sha256, csv_modified_at, providers, services]
      properties:
        version:
          type: string
          format: uuid
          description: uuid da execução (`anatel_pst_run`); é a versão usada no cache e no ETag.
        updated_at:
          type: string
          format: date-time
          description: Quando o arquivo foi aplicado (UTC).
        source:
          type: string
          format: uri
          description: URL de onde o ZIP foi baixado.
        sha256:
          type: string
          description: SHA-256 do ZIP, em hexadecimal.
        csv_sha256:
          type: [string, 'null']
          description: SHA-256 do CSV extraído, em hexadecimal.
        csv_modified_at:
          type: [string, 'null']
          format: date-time
          description: Data de modificação do CSV dentro do ZIP (publicada em hora de Brasília), em UTC.
        providers:
          type: [integer, 'null']
          minimum: 0
          description: Prestadoras (CNPJs) aceitas.
        services:
          type: [integer, 'null']
          minimum: 0
          description: Serviços notificados aceitos.
    Collector:
      type: object
      description: Linha do collector-anatel-pst na tabela central `jobs`.
      required: [app, last_sync_at, last_check_at, consolidated]
      properties:
        app:
          type: string
          const: collector-anatel-pst
          description: Nome do app coletor.
        last_sync_at:
          type: [string, 'null']
          format: date-time
          description: Última sincronização realizada (UTC); `null` se ainda não houve.
        last_check_at:
          type: [string, 'null']
          format: date-time
          description: Última verificação da fonte (UTC); `null` se ainda não houve.
        consolidated:
          type: boolean
          description: '`true` depois que a consolidação (fase 2) copiou os dados atuais.'
    Status:
      type: object
      description: Saúde do serviço (`/health` e `/status`).
      required: [success, status, timestamp, message, checks]
      properties:
        success:
          type: boolean
          description: '`false` só quando o PostgreSQL está fora.'
        status:
          type: string
          enum: [ok, starting, degraded, error]
          description: |-
            `ok` tudo no ar; `starting` ainda sem dados; `degraded` Valkey fora
            (segue sem cache); `error` PostgreSQL fora (HTTP 503).
        timestamp:
          type: string
          format: date-time
          description: Hora da verificação (UTC).
        message:
          type: string
          description: Descrição do estado, em PT-BR.
        checks:
          $ref: '#/components/schemas/StatusChecks'
    StatusChecks:
      type: object
      description: Resultado de cada verificação.
      required: [dataset, postgres, valkey]
      properties:
        dataset:
          type: string
          enum: [ok, empty]
          description: '`empty` antes da primeira carga do collector.'
        postgres:
          type: string
          enum: [ok, error]
          description: Ping no PostgreSQL.
        valkey:
          type: string
          enum: [ok, error, disabled]
          description: Ping no Valkey; `disabled` com o cache desligado.
    IndexResponse:
      type: object
      description: Índice da API (`GET /`, nos dois servidores).
      required: [app, version, base_path, versions, endpoints, source]
      properties:
        app:
          type: string
          const: api-anatel-pst
          description: Nome do app.
        version:
          type: string
          description: Versão do build da API.
        base_path:
          type: string
          description: Caminho de base (`BASE_PATH`).
        versions:
          type: array
          description: Versões da API servidas; a última é a das rotas sem versão.
          items:
            type: string
        endpoints:
          type: array
          description: Rotas principais, já com o caminho de base.
          items:
            type: string
        source:
          type: string
          format: uri
          description: URL do arquivo da fonte.
    Error:
      type: object
      description: Corpo de toda resposta de erro.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, not_found, dataset_not_ready, database_unavailable, timeout, internal_error]
              description: Código estável do erro (use este para decidir no cliente).
            message:
              type: string
              description: Explicação para pessoas, em PT-BR.
