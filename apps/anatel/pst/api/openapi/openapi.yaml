  /meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Estado dos dados
      description: |-
        O arquivo aplicado por último (versão, URL, SHA-256 do ZIP e do CSV,
        data do CSV, prestadoras e serviços) e a linha do collector em
        `jobs`, lidos direto do banco, sem cache. Antes da primeira carga
        responde 200 com `dataset` e `collector` nulos.
      responses:
        '200':
          description: O estado dos dados.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
              examples:
                carregado:
                  summary: Com o arquivo de 2026-09-30 carregado
                  value:
                    app: api-anatel-pst
                    version: '0.1.0'
                    dataset:
