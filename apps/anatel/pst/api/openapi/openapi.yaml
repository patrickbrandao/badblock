  /service/{code}:
    get:
      operationId: getService
      tags: [dados]
      summary: As prestadoras de um serviço
      description: |-
        As prestadoras (CNPJs distintos) que notificaram o serviço, em ordem
        de CNPJ, cada uma com a razão social, o nome fantasia, o município e
        a UF da sede: a lista completa, sem paginação (o SCM, `045`, tem
        20.510 prestadoras e ~2,7 MB). Com `?state=UF`, só as dessa UF; UF
        sem prestadora do serviço responde 200 com a lista vazia. Código que
        não está no arquivo: 404.
      parameters:
        - $ref: '#/components/parameters/ServiceCode'
        - $ref: '#/components/parameters/State'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: O serviço e as suas prestadoras.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
