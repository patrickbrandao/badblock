  /search:
    get:
      operationId: searchProviders
      tags: [dados]
      summary: Busca de prestadoras por nome
      description: |-
        As prestadoras cuja razão social **ou** nome fantasia contém o
        trecho `q`, sem diferenciar maiúsculas (`ILIKE`; `%`, `_` e `\` são
        texto), em ordem de razão social (collation do banco) e CNPJ, com no
        máximo `limit` itens (padrão e máximo 100), sem paginação.
        `truncated` diz se havia mais. Sem resultado: 200 com a lista vazia
        (não há 404).
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchLimit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: As prestadoras encontradas.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Dataset-Version:
              $ref: '#/components/headers/XDatasetVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                telefonica:
                  summary: GET /anatel/pst/search?q=telefonica (trecho — 3 dos 8 itens da resposta real)
