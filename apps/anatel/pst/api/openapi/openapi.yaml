  /services:
    get:
      operationId: listServices
      tags: [dados]
      summary: Catálogo de serviços
      description: |-
        Os códigos de serviço do arquivo (55 em 2026-09-30, ~8,5 KB), em
        ordem de código, cada um com o nome, o grupo, quantas prestadoras
        (CNPJs distintos) o notificaram e quantos serviços notificados
        (linhas) há. Sem parâmetros.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: O catálogo.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Dataset-Version:
              $ref: '#/components/headers/XDatasetVersion'
          content:
            application/json:
              schema:
