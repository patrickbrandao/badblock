# collector-afrinic: importa periodicamente o arquivo delegated-extended da
# AFRINIC (delegações de ASNs e blocos IP) para as tabelas afrinic_* do
# PostgreSQL.
#
# Sobe junto com o resto pelo compose da raiz (include) ou sozinho, a partir
# desta pasta, com um .env próprio (copie o .env.example). Não tem porta nem
# API HTTP: o estado fica nas tabelas afrinic_run e jobs, e nos logs.
#
# A imagem vem do Docker Hub; se a tag não existir lá, o compose gera a imagem
# a partir do código desta pasta.
#
# SOURCE_URL e MIN_RECORDS vazios valem o padrão do app (internal/rir).

name: badblock-collector-afrinic

services:
  collector-afrinic:
    image: ${DOCKERHUB_NAMESPACE:-tmsoftbrasil}/badblock-collector-afrinic:${COLLECTOR_AFRINIC_TAG:-latest}
    build:
      context: .
      args:
        VERSION: ${COLLECTOR_AFRINIC_TAG:-dev}
    container_name: badblock-collector-afrinic
    restart: unless-stopped
    environment:
      # Usuário postgres no banco badblock. Senha só com letras e números.
      POSTGRES_URL: ${POSTGRES_URL:-postgres://postgres:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@badblock-postgres:5432/badblock?sslmode=disable}
      SYNC_INTERVAL: ${COLLECTOR_AFRINIC_SYNC_INTERVAL:-1h}
      RETRY_INTERVAL: ${COLLECTOR_AFRINIC_RETRY_INTERVAL:-5m}
      SOURCE_URL: ${COLLECTOR_AFRINIC_SOURCE_URL:-}
      SOURCE_MD5_URL: ${COLLECTOR_AFRINIC_SOURCE_MD5_URL:-}
      MIN_RECORDS: ${COLLECTOR_AFRINIC_MIN_RECORDS:-}
      REMOVAL_THRESHOLD: ${COLLECTOR_AFRINIC_REMOVAL_THRESHOLD:-0.05}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
    networks: [badblock]
    labels:
      # O Traefik do servidor publica todo container por padrão.
      traefik.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  badblock:
    name: badblock
    external: true
