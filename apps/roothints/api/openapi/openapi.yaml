                    letter: k
                    ipv4: 193.0.14.129
                    ipv6: '2001:7fd::1'
                    ns_ttl: 3600000
                    ipv4_ttl: 3600000
                    ipv6_ttl: 3600000
                    note: OPERATED BY RIPE NCC
                    first_seen: '2026-09-30T03:47:52Z'
                    updated_at: '2026-09-30T03:47:52Z'
                    source:
                      last_update: '2026-09-24'
                      zone_serial: 2026092401
                    dataset:
                      version: 01a0f06d-08c2-7f4a-924a-b345129d0f5a
                      updated_at: '2026-09-30T03:47:52Z'
