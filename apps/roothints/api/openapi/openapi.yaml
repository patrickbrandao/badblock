openapi: 3.1.0
info:
  title: api-roothints
  version: '0.1.0'
  summary: Servidores raiz do DNS (root hints do named.root da InterNIC), em JSON.
  description: |-
    API HTTP (JSON), só de leitura, com os **servidores raiz do DNS** — nome,
    letra, endereços IPv4 e IPv6, TTLs e a nota de cada um — a partir do
    arquivo [`named.root`](https://www.internic.net/domain/named.root) da
    InterNIC (os root hints, hoje 13 servidores, `a` a `m.root-servers.net`),
    que o `collector-roothints` grava nas tabelas `roothints_*`. Pública, sem
    chave; rate limit por IP no proxy.

    - Endereços **sem máscara** (`198.41.0.4`, `2001:503:ba3e::2:30`).
      `ipv4`/`ipv6` (com o TTL) e `note` saem `null` quando o arquivo não os
      traz.
    - As rotas de dados trazem o bloco `source` com o cabeçalho do arquivo da
      versão usada: a data de `last update:` e o serial da zona raiz
      (`related version of root zone:`).
    - Versões são servidores: as rotas de dados respondem no servidor sem
      versão (versão atual, hoje v1) e no servidor `/v1` (v1 fixa), com o
      mesmo conteúdo, o mesmo ETag e a mesma chave de cache. Saúde
      (`/health`, `/status`, `/ping`) e `/openapi.yaml` ficam fora do
      versionamento: só existem no servidor sem versão (declaram `servers`
      próprios).
    - Toda rota com `GET` também aceita `HEAD`; `OPTIONS` responde o preflight
      de CORS (204, `GET, HEAD, OPTIONS`). `/roothints` redireciona (301) para
      `/roothints/`; qualquer outro caminho responde 404 em JSON.
    - Rotas de dados: ETag fraco (versão do dataset + consulta normalizada),
      `If-None-Match` → 304, `Cache-Control: public, max-age=300`, `X-Cache`
      e `X-Dataset-Version`.
    - Todas as respostas levam `X-Content-Type-Options: nosniff`,
      `Referrer-Policy: no-referrer`, `Access-Control-Allow-Origin`,
      `Access-Control-Expose-Headers: ETag, X-Cache, X-Dataset-Version` e
      `Server: badblock-api-roothints/<versão>`.
    - Erros sempre em JSON `{"error": {"code", "message"}}`, com
      `Cache-Control: no-store`. A validação vem antes de tudo: um pedido
      inválido recebe 400 mesmo antes da primeira carga dos dados.
  license:
    name: MIT
    identifier: MIT
externalDocs:
  description: Especificações da fonte (fonte da verdade)
  url: https://github.com/patrickbrandao/badblock/tree/main/specs/fontes/roothints
servers:
  - url: https://api.badblock.net.br/roothints
    description: Produção, versão atual (hoje v1)
  - url: https://api.badblock.net.br/roothints/v1
    description: Produção, v1 fixa
  - url: http://127.0.0.1:8109/roothints
    description: Desenvolvimento local, versão atual (porta publicada no loopback pelo docker-compose.yml)
  - url: http://127.0.0.1:8109/roothints/v1
    description: Desenvolvimento local, v1 fixa
tags:
  - name: dados
    description: Consultas aos servidores raiz do named.root (com ETag e cache no Valkey).
  - name: meta
    description: Índice, estado dos dados e este manifesto.
  - name: saúde
    description: Saúde do serviço, fora do versionamento.
paths:
  /:
    get:
      operationId: getIndex
      tags: [meta]
      summary: Índice da API
      description: |-
        App, versão do build, caminho de base, versões da API, rotas e a URL
        da fonte. Responde igual nos dois servidores (`/roothints/` e
        `/roothints/v1/`); não consulta o banco nem o Valkey.
      responses:
        '200':
          description: O índice.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
              example:
                app: api-roothints
                version: '0.1.0'
                base_path: /roothints
                versions: [v1]
                endpoints:
                  - /roothints/servers
                  - /roothints/server/{server}
                  - /roothints/meta
                  - /roothints/status
                  - /roothints/openapi.yaml
                source: https://www.internic.net/domain/named.root
  /servers:
    get:
      operationId: listServers
      tags: [dados]
      summary: Todos os servidores raiz
      description: |-
