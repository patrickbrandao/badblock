  /server/{server}:
    get:
      operationId: getServer
      tags: [dados]
      summary: Um servidor raiz pela letra ou pelo nome
      description: |-
        Um servidor raiz, com as datas deste banco (`first_seen`,
        `updated_at`) e o bloco `source`. Aceita a letra (`k`) ou o nome
        (`k.root-servers.net`), sem diferenciar maiúsculas e com ou sem o
        ponto final (`K.ROOT-SERVERS.NET.`); todas as formas são a mesma
        consulta, com o mesmo ETag. Vale qualquer letra de `a` a `z`: uma que
        não está no arquivo (`n`) é 404; o resto é 400.
      parameters:
        - $ref: '#/components/parameters/Server'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: O servidor.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Dataset-Version:
              $ref: '#/components/headers/XDatasetVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
              examples:
                pela_letra:
                  summary: GET /roothints/server/a
                  value:
                    name: a.root-servers.net
                    letter: a
                    ipv4: 198.41.0.4
                    ipv6: '2001:503:ba3e::2:30'
                    ns_ttl: 3600000
                    ipv4_ttl: 3600000
                    ipv6_ttl: 3600000
