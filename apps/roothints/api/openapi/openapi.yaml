      operationId: getMeta
      tags: [meta]
      summary: Estado dos dados
      description: |-
        Último arquivo aplicado (com o cabeçalho e os hashes) e a linha do
        `collector-roothints` na tabela `jobs`, lidos na hora (sem Valkey e
        sem ETag). `dataset` e `collector` são `null` antes da primeira carga.
      responses:
