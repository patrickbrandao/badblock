  /health:
    servers:
      - url: https://api.badblock.net.br/roothints
        description: Produção
      - url: http://127.0.0.1:8109/roothints
        description: Desenvolvimento local
    get:
      operationId: getHealth
      tags: [saúde]
      summary: Saúde do serviço
      description: |-
        Mesmo conteúdo de `/status`. Confere o PostgreSQL, o Valkey e se já
        há dados carregados; nunca usa o cache.
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StatusError'
    post:
      operationId: postHealth
      tags: [saúde]
      summary: Saúde do serviço (POST)
      description: Igual ao `GET /health`; o corpo do pedido é ignorado.
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StatusError'
  /status:
    servers:
      - url: https://api.badblock.net.br/roothints
        description: Produção
      - url: http://127.0.0.1:8109/roothints
        description: Desenvolvimento local
    get:
      operationId: getStatus
      tags: [saúde]
      summary: Estado do serviço
      description: |-
        Verifica, nesta ordem, os dados, o Valkey e o PostgreSQL; cada falha
        sobrescreve a anterior, então a precedência é `error` > `degraded` >
        `starting` > `ok`: `ok` com tudo no ar; `starting` antes da primeira
        carga do collector; `degraded` com o Valkey fora (a API segue sem
        cache); `error` (HTTP 503, `success: false`) com o PostgreSQL fora.
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StatusError'
    post:
      operationId: postStatus
      tags: [saúde]
      summary: Estado do serviço (POST)
      description: Igual ao `GET /status`; o corpo do pedido é ignorado.
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StatusError'
  /ping:
    servers:
      - url: https://api.badblock.net.br/roothints
        description: Produção
      - url: http://127.0.0.1:8109/roothints
        description: Desenvolvimento local
    get:
      operationId: ping
      tags: [saúde]
      summary: pong
      description: |-
        Responde o texto `pong` sem consultar nada. É o healthcheck do Docker
        (a cada 15 s) e fica fora do log de acesso.
      responses:
        '200':
          description: O texto `pong`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            text/plain:
              schema:
                type: string
                const: pong
              example: pong
  /openapi.yaml:
    servers:
      - url: https://api.badblock.net.br/roothints
        description: Produção
      - url: http://127.0.0.1:8109/roothints
        description: Desenvolvimento local
    get:
      operationId: getOpenAPI
      tags: [meta]
      summary: Este manifesto OpenAPI
      description: |-
        O contrato da API em OpenAPI 3.1, embutido no binário (mesmo conteúdo
        de `openapi/openapi.yaml` no repositório). Não usa o banco nem o
        Valkey.
      responses:
        '200':
          description: O manifesto em YAML.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
          content:
            application/yaml:
              schema:
                type: string
components:
  parameters:
    Server:
      name: server
      in: path
      required: true
      description: |-
        A letra do servidor (`a` a `z`) ou o nome `<letra>.root-servers.net`,
        com ou sem o ponto final, sem diferenciar maiúsculas (só ASCII).
        Normalizado para a letra em minúsculas: `k`, `K`,
        `k.root-servers.net` e `K.ROOT-SERVERS.NET.` são a mesma consulta.
        Letra que não está no arquivo: 404. Outro formato: 400.
      schema:
        type: string
        pattern: '^[A-Za-z](\.[Rr][Oo][Oo][Tt]-[Ss][Ee][Rr][Vv][Ee][Rr][Ss]\.[Nn][Ee][Tt]\.?)?$'
      example: a
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |-
        ETag de uma resposta anterior (fraco ou forte, vários separados por
        vírgula, ou `*`). Se algum bater com o ETag atual, a resposta é 304
        sem corpo e sem consultar nada.
      schema:
        type: string
      example: 'W/"c618b310d98767be"'
  headers:
    ETag:
      description: |-
        ETag fraco, `W/"<FNV-1a de 64 bits da versão do dataset + consulta
        normalizada>"`. Igual com e sem `/v1` e muda quando a versão dos dados
        muda.
      schema:
        type: string
      example: 'W/"fbf484ee604cba0"'
    CacheControlPublic:
      description: Cache por 5 minutos em clientes e proxies.
      schema:
        type: string
        const: public, max-age=300
    CacheControlNoStore:
      description: Não guardar em cache.
      schema:
        type: string
        const: no-store
    XCache:
      description: |-
        `HIT` (veio do Valkey, ou 304), `MISS` (consultou o PostgreSQL) ou
        `BYPASS` (cache desligado).
      schema:
        type: string
        enum: [HIT, MISS, BYPASS]
    XDatasetVersion:
      description: Versão dos dados usada na resposta (uuid da última carga aplicada).
      schema:
        type: string
        format: uuid
      example: 01a0f06d-08c2-7f4a-924a-b345129d0f5a
  responses:
    NotModified:
      description: |-
        O `If-None-Match` bate com o ETag atual: sem corpo, sem
        `Content-Type` e sem consultar o banco nem o Valkey.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControlPublic'
        X-Cache:
          $ref: '#/components/headers/XCache'
        X-Dataset-Version:
          $ref: '#/components/headers/XDatasetVersion'
    BadRequest:
      description: Parâmetro inválido (`bad_request`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            server:
              summary: Servidor inválido (/server/{server})
              value:
                error:
                  code: bad_request
                  message: 'servidor inválido: use a letra (ex.: a) ou o nome (ex.: a.root-servers.net), sem diferenciar maiúsculas'
    NotFound:
      description: Nenhum registro para a consulta (`not_found`); não entra no cache.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            server:
              summary: Letra fora do named.root (/server/n)
              value:
                error:
                  code: not_found
                  message: o servidor raiz n.root-servers.net não consta no named.root da InterNIC
    ServiceUnavailable:
      description: |-
        `dataset_not_ready` antes da primeira carga do collector (sem
        consultar o banco), ou `database_unavailable` quando o PostgreSQL
        falha.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            dataset_not_ready:
              summary: Antes da primeira carga
              value:
                error:
                  code: dataset_not_ready
                  message: a primeira sincronização do collector-roothints ainda não terminou; tente em alguns minutos
            database_unavailable:
              summary: PostgreSQL fora
              value:
                error:
                  code: database_unavailable
                  message: banco de dados indisponível
    DatabaseUnavailable:
      description: Falha no PostgreSQL (`database_unavailable`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: database_unavailable
              message: banco de dados indisponível
    Timeout:
      description: A consulta passou de `DB_TIMEOUT` (`timeout`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: timeout
              message: a consulta demorou demais
    InternalError:
      description: Panic no servidor, registrado no log (`internal_error`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: erro interno
    StatusOK:
      description: Serviço no ar (`ok`, `starting` ou `degraded`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
          examples:
            ok:
              summary: Tudo no ar
              value:
                success: true
                status: ok
                timestamp: '2026-09-30T03:47:59Z'
                message: api-roothints operacional
                checks:
                  dataset: ok
                  postgres: ok
                  valkey: ok
            starting:
              summary: Antes da primeira carga do collector
              value:
                success: true
                status: starting
                timestamp: '2026-09-30T03:47:45Z'
                message: aguardando a primeira sincronização do collector-roothints
                checks:
                  dataset: empty
                  postgres: ok
                  valkey: ok
    StatusError:
      description: PostgreSQL fora (`status` = `error`, `success` = false).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
          example:
            success: false
            status: error
            timestamp: '2026-09-30T03:47:59Z'
            message: PostgreSQL indisponível
            checks:
              dataset: ok
              postgres: error
              valkey: ok
  schemas:
    Dataset:
      type: object
      description: Versão dos dados usada na resposta; acompanha toda resposta de dados.
      required: [version, updated_at]
      properties:
        version:
          type: string
          format: uuid
          description: uuid da última carga aplicada pelo collector-roothints (`roothints_run`).
        updated_at:
          type: string
          format: date-time
          description: Quando essa carga foi aplicada (UTC).
    Source:
      type: object
      description: Cabeçalho do named.root da versão usada na resposta.
      required: [last_update, zone_serial]
      properties:
        last_update:
          type: [string, 'null']
          format: date
          description: Data de `last update:` do cabeçalho; `null` só numa carga fora do padrão.
        zone_serial:
          type: [integer, 'null']
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Serial da zona raiz (`related version of root zone:`, `AAAAMMDDnn`); `null` só numa carga fora do padrão.
    Server:
      type: object
      description: Um servidor raiz (item de `/servers` e base de `/server/{server}`).
      required: [name, letter, ipv4, ipv6, ns_ttl, ipv4_ttl, ipv6_ttl, note]
      properties:
        name:
          type: string
          pattern: '^[a-z]\.root-servers\.net$'
          description: Nome em minúsculas e sem o ponto final.
        letter:
          type: string
          pattern: '^[a-z]$'
          description: Letra do servidor, o primeiro rótulo de `name`.
        ipv4:
          type: [string, 'null']
          format: ipv4
          description: Endereço do registro `A`, sem máscara; `null` se o arquivo não traz `A`.
        ipv6:
          type: [string, 'null']
          format: ipv6
          description: Endereço do registro `AAAA`, sem máscara e na forma curta; `null` se o arquivo não traz `AAAA`.
        ns_ttl:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: TTL, em segundos, da linha `. NS`.
        ipv4_ttl:
          type: [integer, 'null']
          minimum: 0
          maximum: 2147483647
          description: TTL do registro `A`; `null` junto com `ipv4`.
        ipv6_ttl:
          type: [integer, 'null']
          minimum: 0
          maximum: 2147483647
          description: TTL do registro `AAAA`; `null` junto com `ipv6`.
        note:
          type: [string, 'null']
          description: Comentário do bloco no arquivo, sem o `;`, como publicado; `null` se o bloco não tem comentário.
    ServersResponse:
      type: object
      description: Todos os servidores raiz (`GET /servers`).
      required: [source, count, servers, dataset]
      properties:
        source:
          $ref: '#/components/schemas/Source'
        count:
          type: integer
          minimum: 0
          description: Número de servidores na lista.
        servers:
          type: array
          description: Os servidores, em ordem de letra.
          items:
            $ref: '#/components/schemas/Server'
        dataset:
          $ref: '#/components/schemas/Dataset'
    ServerResponse:
      description: Um servidor raiz (`GET /server/{server}`).
      allOf:
        - $ref: '#/components/schemas/Server'
        - type: object
          required: [first_seen, updated_at, source, dataset]
          properties:
            first_seen:
              type: string
              format: date-time
              description: Quando este banco viu o servidor pela primeira vez (UTC).
            updated_at:
              type: string
              format: date-time
              description: Última mudança de endereço, TTL ou comentário (UTC).
            source:
              $ref: '#/components/schemas/Source'
            dataset:
              $ref: '#/components/schemas/Dataset'
    MetaResponse:
      type: object
      description: Estado dos dados (`GET /meta`).
      required: [app, version, dataset, collector]
      properties:
        app:
          type: string
          const: api-roothints
          description: Nome do app.
        version:
          type: string
          description: Versão do build da API.
        dataset:
          description: Último arquivo aplicado; `null` antes da primeira carga.
          oneOf:
            - $ref: '#/components/schemas/MetaDataset'
            - type: 'null'
        collector:
          description: Linha do collector-roothints em `jobs`; `null` antes da primeira execução.
          oneOf:
            - $ref: '#/components/schemas/Collector'
            - type: 'null'
    MetaDataset:
      type: object
      description: O named.root aplicado por último.
      required: [version, updated_at, source, md5, sha256, last_update, zone_serial, servers]
      properties:
        version:
          type: string
          format: uuid
          description: uuid da carga (`roothints_run`); é a versão usada no cache e no ETag.
        updated_at:
          type: string
          format: date-time
          description: Quando a carga foi aplicada (UTC).
        source:
          type: string
          format: uri
          description: URL de onde o arquivo foi baixado.
        md5:
          type: string
          description: MD5 do arquivo, em hexadecimal minúsculo.
        sha256:
          type: string
          description: SHA-256 do arquivo, em hexadecimal minúsculo.
        last_update:
          type: [string, 'null']
          format: date
          description: Data de `last update:` do cabeçalho.
        zone_serial:
          type: [integer, 'null']
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Serial da zona raiz do cabeçalho.
        servers:
          type: integer
          minimum: 0
          description: Servidores lidos do arquivo.
    Collector:
      type: object
      description: Linha do collector-roothints na tabela central `jobs`.
      required: [app, last_sync_at, last_check_at, consolidated]
      properties:
        app:
          type: string
          const: collector-roothints
          description: Nome do app coletor.
        last_sync_at:
          type: [string, 'null']
          format: date-time
          description: Última aplicação de um arquivo novo (UTC); `null` se ainda não houve.
        last_check_at:
          type: [string, 'null']
          format: date-time
          description: Última verificação da fonte (UTC); `null` se ainda não houve.
        consolidated:
          type: boolean
          description: '`true` depois que a consolidação (fase 2) copiou os dados atuais.'
    Status:
      type: object
      description: Saúde do serviço (`/health` e `/status`).
      required: [success, status, timestamp, message, checks]
      properties:
        success:
          type: boolean
          description: '`false` só quando o PostgreSQL está fora.'
        status:
          type: string
          enum: [ok, starting, degraded, error]
          description: |-
            `ok` tudo no ar; `starting` ainda sem dados; `degraded` Valkey fora
            (segue sem cache); `error` PostgreSQL fora (HTTP 503).
        timestamp:
          type: string
          format: date-time
          description: Hora da verificação (UTC).
        message:
          type: string
          description: Descrição do estado, em PT-BR.
        checks:
          $ref: '#/components/schemas/StatusChecks'
    StatusChecks:
      type: object
      description: Resultado de cada verificação.
      required: [dataset, postgres, valkey]
      properties:
        dataset:
          type: string
          enum: [ok, empty]
          description: '`empty` antes da primeira carga do collector.'
        postgres:
          type: string
          enum: [ok, error]
          description: Ping no PostgreSQL.
        valkey:
          type: string
          enum: [ok, error, disabled]
          description: Ping no Valkey; `disabled` com o cache desligado.
    IndexResponse:
      type: object
      description: Índice da API (`GET /`, nos dois servidores).
      required: [app, version, base_path, versions, endpoints, source]
      properties:
        app:
          type: string
          const: api-roothints
          description: Nome do app.
        version:
          type: string
          description: Versão do build da API.
        base_path:
          type: string
          description: Caminho de base (`BASE_PATH`).
        versions:
          type: array
          description: Versões da API servidas; a última é a das rotas sem versão.
          items:
            type: string
        endpoints:
          type: array
          description: Rotas principais, já com o caminho de base.
          items:
            type: string
        source:
          type: string
          format: uri
          description: URL do arquivo da fonte.
    Error:
      type: object
      description: Corpo de toda resposta de erro.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, not_found, dataset_not_ready, database_unavailable, timeout, internal_error]
              description: Código estável do erro (use este para decidir no cliente).
            message:
              type: string
              description: Explicação para pessoas, em PT-BR.
