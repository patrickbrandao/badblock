openapi: 3.1.0
info:
  title: api-rdns
  version: '0.1.0'
  summary: DNS reverso (PTR) dos IPv4 varridos pelo BadBlock, com resolução em tempo real.
  description: |
    API HTTP (JSON), pública, do DNS reverso (PTR) de todo IPv4 dos prefixos
    que o BadBlock varre. Não há arquivo publicado: o `collector-rdns` é uma
    sonda ativa que pergunta o PTR de cada endereço a resolvedores recursivos
    e grava o nome — ou a falha — nas tabelas `rdns_*` do PostgreSQL. Os
    prefixos são os blocos IPv4 do `cgibr` (NIC.br), quebrados em /24, e os
    que o administrador cadastra. Esta API lê essas tabelas e, com
    `live=true`, pede ao coletor uma resolução na hora.

    - Cada endereço tem um estado: `ptr` (tem nome), `no_ptr` (NXDOMAIN ou
      sem PTR), `servfail`, `refused`, `timeout` (falhas da consulta) ou
      `not_scanned` (o prefixo nunca foi varrido). Uma falha nunca apaga um
      PTR: o IP com nome continua com o nome até um NXDOMAIN ou um nome novo.
    - O bloco `scan` de cada resposta é o prefixo cadastrado que contém o
      pedido e `checked_at`, a data da última varredura completa dele: é a
      data do dado de todos os IPs do prefixo (não há data por IP).
    - Cache sem versão de dataset: o dado muda um prefixo de cada vez, o dia
      inteiro, então a resposta em cache pode ter até 1 h (`REDIS_KEY_TTL`)
      de atraso em relação ao banco. O ETag é o hash do corpo; não existe
      `X-Dataset-Version`.
    - `live=true` (só em `/ip`) põe o IP na fila de tempo real e espera até
      5 s pela resposta do coletor; estourou, responde o dado frio com
      `live.status` `timeout`. Os estados do bloco `live` estão em
      `components.schemas.Live`. No Traefik, `live=true` tem rate limit
      próprio, mais apertado (1 req/s por IP, rajada 5).
    - Não há rota por ASN (um ASN chega a dezenas de milhares de /24).
    - A API é dona de tudo abaixo do caminho de base (`BASE_PATH`, padrão
      `/rdns`), que já está nos `servers`. As rotas de dados respondem sem
      versão (versão atual, hoje v1) e no servidor `.../rdns/v1` (v1 fixa),
      com o mesmo conteúdo, a mesma chave de cache e o mesmo ETag.
    - Saúde (`/health`, `/status`, `/ping`) e este manifesto (`/openapi.yaml`)
      ficam fora do versionamento: só existem nos servidores sem `/v1`.
    - Toda rota `GET` também responde `HEAD`; `OPTIONS` em qualquer caminho
      responde o preflight de CORS (204).
    - Todas as respostas levam `X-Content-Type-Options: nosniff`,
      `Referrer-Policy: no-referrer`, `Access-Control-Allow-Origin`
      (`CORS_ORIGIN`, padrão `*`), `Access-Control-Expose-Headers: ETag,
      X-Cache` e `Server: badblock-api-rdns/<versão>`.
    - Erros são sempre JSON `{"error": {"code", "message"}}` com
      `Cache-Control: no-store`. O caminho de base sem barra redireciona (301)
      para o índice; qualquer outro caminho inexistente responde 404
      `not_found`.
    - Sem chave de acesso; o Traefik aplica rate limit por IP.
  license:
    name: MIT
    identifier: MIT
externalDocs:
  description: Especificações da fonte (fonte da verdade)
  url: https://github.com/patrickbrandao/badblock/tree/main/specs/fontes/rdns
servers:
  - url: https://api.badblock.net.br/rdns
    description: Produção, versão atual (hoje v1)
  - url: https://api.badblock.net.br/rdns/v1
    description: Produção, v1 fixa (só rotas de dados)
  - url: http://127.0.0.1:8113/rdns
    description: Desenvolvimento local, versão atual (porta API_RDNS_HOST_PORT no loopback)
  - url: http://127.0.0.1:8113/rdns/v1
    description: Desenvolvimento local, v1 fixa (só rotas de dados)
tags:
  - name: dados
    description: O reverso de um IP ou de um prefixo, cacheado no Valkey e com ETag (ou em tempo real).
  - name: meta
    description: Índice, estado da varredura e este manifesto.
  - name: saúde
    description: Verificações de saúde, fora do versionamento.
paths:
  /:
    get:
      operationId: getIndex
      summary: Índice da API
      description: >-
        Nome do app, versão do build, caminho de base, versões da API, lista
        de rotas, a spec da fonte (`source`) e as fontes de onde vêm os
        prefixos derivados (`derived_from`). Não consulta o banco.
      tags: [meta]
      responses:
        '200':
          description: Índice.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
              example:
                app: api-rdns
                version: 0.1.0
                base_path: /rdns
                versions: [v1]
                endpoints:
                  - /rdns/ip/{ip}
                  - /rdns/prefix/{ip}/{len}
                  - /rdns/meta
                  - /rdns/status
                  - /rdns/openapi.yaml
                source: https://github.com/patrickbrandao/badblock/tree/main/specs/fontes/rdns
                derived_from: [cgibr]
        '500':
          $ref: '#/components/responses/InternalError'
  /ip/{ip}:
    get:
      operationId: getIP
      summary: PTR de um IPv4
      description: >-
        O PTR de um IPv4 que está num prefixo cadastrado (ativo ou não), com
        o estado da última consulta e o bloco `scan` do prefixo. Sem
        `live`, vem do cache (ou do banco) com ETag. Com `live=true`, pede ao
        `collector-rdns` uma resolução na hora e espera até `LIVE_TIMEOUT`
        (5 s): a resposta traz o bloco `live`, sai com `Cache-Control:
        no-store`, `X-Cache: LIVE` e sem ETag (`If-None-Match` é ignorado);
        o mesmo IP resolvido há menos de `LIVE_MIN_AGE` (60 s) responde
        `recent` sem consulta nova; a fila cheia responde 503
        `live_queue_full`.
      tags: [dados]
      parameters:
        - $ref: '#/components/parameters/IP'
        - $ref: '#/components/parameters/Live'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: IP num prefixo cadastrado.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPResponse'
              examples:
                ptr:
                  summary: Com PTR
                  value:
                    ip: 200.160.2.3
                    status: ptr
                    name: registro.br
                    names: [registro.br]
                    first_seen: '2026-10-10T17:26:56Z'
                    updated_at: '2026-10-10T17:26:56Z'
                    scan:
                      prefix: 200.160.2.0/24
                      asn: 22548
                      source: cgibr
                      active: true
                      checked_at: '2026-10-10T17:26:56Z'
                no_ptr:
                  summary: Sem PTR (NXDOMAIN), prefixo já varrido
                  value:
                    ip: 200.160.2.2
                    status: no_ptr
                    name: null
                    names: []
                    first_seen: null
                    updated_at: null
                    scan:
                      prefix: 200.160.2.0/24
                      asn: 22548
                      source: cgibr
                      active: true
                      checked_at: '2026-10-10T17:26:56Z'
                live:
                  summary: Com live=true, resolvido na hora (dois PTR)
                  value:
                    ip: 200.160.2.5
                    status: ptr
                    name: mailexploder.registro.br
                    names: [mailexploder.registro.br, mailx.registro.br]
                    first_seen: '2026-10-10T17:26:56Z'
                    updated_at: '2026-10-10T17:26:56Z'
                    scan:
                      prefix: 200.160.2.0/24
                      asn: 22548
                      source: cgibr
                      active: true
                      checked_at: '2026-10-10T17:26:56Z'
                    live:
                      status: resolved
                      result: ptr
                      checked_at: '2026-10-10T17:27:21Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/LiveQueueFull'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
  /prefix/{ip}/{len}:
    get:
      operationId: getPrefix
      summary: PTR de todos os endereços de um prefixo
      description: >-
        Todos os endereços de um prefixo de /24 a /31, em ordem, cada um com o
        estado e os nomes, e a contagem por estado. Os bits de host são
        zerados (`/prefix/200.160.2.77/24` consulta `200.160.2.0/24`). O
        prefixo pedido tem de estar contido num prefixo cadastrado. Um /24
        sai com 256 itens (~20 KB). `live` não vale aqui (400).
      tags: [dados]
      parameters:
        - $ref: '#/components/parameters/PrefixIP'
        - $ref: '#/components/parameters/PrefixLength'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Prefixo contido num prefixo cadastrado.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            X-Cache:
              $ref: '#/components/headers/XCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefixResponse'
              example:
                prefix: 200.160.2.0/30
                scan:
                  prefix: 200.160.2.0/24
                  asn: 22548
                  source: cgibr
                  active: true
                  checked_at: '2026-10-10T17:26:56Z'
                counts:
                  ptr: 2
                  no_ptr: 2
                  servfail: 0
                  refused: 0
                  timeout: 0
                  not_scanned: 0
                items:
                  - ip: 200.160.2.0
                    status: no_ptr
                    name: null
                    names: []
                  - ip: 200.160.2.1
                    status: ptr
                    name: ae1-0.ar1.vr.registro.br
                    names: [ae1-0.ar1.vr.registro.br]
                  - ip: 200.160.2.2
                    status: no_ptr
                    name: null
                    names: []
                  - ip: 200.160.2.3
                    status: ptr
                    name: registro.br
                    names: [registro.br]
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DataUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'
  /meta:
    get:
      operationId: getMeta
      summary: Estado da varredura
      description: >-
        Resumo de `rdns_prefix` (fila, prefixos vencidos, fora da regra,
        somas da última varredura), a configuração em `rdns_config`, a última
        derivação aplicada de cada origem, as instâncias do `collector-rdns`
        com sinal nas últimas 24 h, a linha dele em `jobs` e o tamanho da fila
        de tempo real. Consulta o banco a cada requisição (sem cache, sem
        ETag) e responde 200 mesmo antes do primeiro prefixo.
      tags: [meta]
      responses:
        '200':
          description: Estado da varredura.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
              examples:
                carregado:
                  summary: Com a primeira derivação feita (stack local, 2026-10-10)
                  value:
                    app: api-rdns
                    version: 0.1.0
                    scan:
                      prefixes: 308529
                      active: 308529
                      static: 0
                      out_of_rule: 0
                      addresses: 78983424
                      never_scanned: 308521
                      overdue: 0
                      rescan: 0
                      scanning: 4
                      oldest_scan_at: '2026-10-10T17:26:56Z'
                      ptr: 91
                      no_ptr: 1957
                      failed: 0
                    config:
                      rate_limit: null
                      scan_interval: null
                    derivations:
                      - source: cgibr
                        version: 01a126dc-3c4f-7299-b5f0-b06cf6f71b18
                        source_version: 01a126d2-2925-7580-bf16-b8315a3c65c9
                        source_updated_at: '2026-10-10T17:17:49Z'
                        created_at: '2026-10-10T17:27:45Z'
                        blocks: 13048
                        units: 308529
                        inserted: 0
                        asn_updated: 0
                        covered: 308529
                        not_in_source: 0
                    workers:
                      - host: 14a62ed1f89f
                        version: 0.1.0
                        started_at: '2026-10-10T17:23:42Z'
                        seen_at: '2026-10-10T17:28:42Z'
