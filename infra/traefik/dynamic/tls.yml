# Certificado local para *.badblock.localhost, gerado por `make certs`
# (mkcert, ou openssl com uma CA local quando o mkcert não está instalado).
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/badblock.localhost.pem
        keyFile: /certs/badblock.localhost-key.pem
  certificates:
    - certFile: /certs/badblock.localhost.pem
      keyFile: /certs/badblock.localhost-key.pem
