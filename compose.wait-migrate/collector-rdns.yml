# Override usado só pelo docker-compose.yml da raiz: o collector-rdns (todas
# as réplicas) espera as migrations terminarem antes de subir. Sozinho, a
# partir da pasta do app, ele não depende do migrate (a derivação tenta de
# novo a cada DERIVE_INTERVAL e a fila a cada 10 s).
# Um arquivo por collector: cada include é um modelo à parte, e um override
# que citasse outros serviços criaria serviços sem imagem.
services:
  collector-rdns:
    depends_on:
      migrate:
        condition: service_completed_successfully
